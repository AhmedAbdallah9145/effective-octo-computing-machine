/* Builds the per-test row cells shared by both documents.
   withPrice=true appends the price cell (invoice only). */
function buildDocTestRow(tid, index, o, gender, withPrice){
  const t = testById(tid); if(!t) return '';
  const r = (o.results && o.results[tid]) || {};
  const te = effTest(t, r);
  const range = activeRefRange(te, gender);
  const isNumeric = !!range;
  const pk = phaseKey(t), ph = r.phase ? phaseById(t, r.phase) : null;
  let refDisplay = isNumeric ? rangeLabel(range, te.unit||'') : (te.refText||'—');
  if(ph && isNumeric) refDisplay = `${ph.en}: ${range.lo} - ${range.hi} ${te.unit||''}`;
  else if(/^testosterone/i.test((t.nameEn||t.name||'').trim()) && !r.refOv && te.refLowM!=null && te.refLowF!=null)
    refDisplay = `Male: ${te.refLowM} - ${te.refHighM} | Female: ${te.refLowF} - ${te.refHighF} ${te.unit||''}`;
  else if(pk && !r.refOv) refDisplay = PHASE_RANGES[pk].map(p=>`${p.en}: ${p.lo} - ${p.hi}`).join(' | ');
  const flag = isNumeric ? r.flag : r.manualFlag;
  const flagMap = { normal:'Normal', high:'High', low:'Low', 'critical-high':'High', 'critical-low':'Low' };
  const flagText = flagMap[flag] || '—';
  const isCritical = flag==='critical-high' || flag==='critical-low';
  const abn = ['high','low','critical-high','critical-low'].includes(flag);
  const arrow = (flag==='high'||flag==='critical-high') ? ' ↑' : ((flag==='low'||flag==='critical-low') ? ' ↓' : '');
  const priceCell = withPrice ? `<td class="price-col">${fmtMoney((o.prices && o.prices[tid]!=null) ? o.prices[tid] : (t.price||0))}</td>` : '';
  return `<tr${isCritical?' class="flag-critical"':''}>
      <td>${index+1}</td>
      <td><strong dir="ltr">${escapeHtml(testDisplayName(t))}</strong></td>
      <td class="center${abn?' abn':''}">${escapeHtml(r.value!=null && r.value!=='' ? r.value : '—')}${arrow}</td>
      <td>${escapeHtml(te.unit||'—')}</td>
      <td${String(refDisplay).includes(' | ')?' style="font-size:0.82em;line-height:1.35"':''}>${escapeHtml(refDisplay).split(' | ').join('<br>')}</td>
      <td>${escapeHtml(flagText)}</td>
      ${priceCell}
    </tr>`;
}

/* Groups an order's tests by category, so the printed table shows each
   category's results as its own separately-headed block. */
function buildDocTestRowsGrouped(o, gender, withPrice){
  const colspan = withPrice ? 7 : 6;
  const byCat = {};
  o.testIds.forEach(tid=>{
    const t = testById(tid); if(!t) return;
    const cat = t.category || 'عام';
    (byCat[cat] = byCat[cat] || []).push(tid);
  });
  const cats = Object.keys(byCat).sort((a,b)=>a.localeCompare(b,'ar'));
  let index = 0;
  return cats.map(cat=>{
    const c = categoryColor(cat);
    const header = `<tr class="doc-cat-row"><td colspan="${colspan}" style="background:${c.bg};color:${c.fg}">${escapeHtml(cat)}</td></tr>`;
    const rows = byCat[cat].map(tid=>{
      const row = buildDocTestRow(tid, index, o, gender, withPrice);
      index++;
      return row;
    }).join('');
    return header + rows;
  }).join('');
}

/* Results report: one table per section (category) so a section is kept together on a page
   and its title + column headers repeat if the section has to continue on the next page. */
function buildReportSections(o, gender, L){
  const byCat = {};
  o.testIds.forEach(tid=>{ const t = testById(tid); if(!t) return; const c = t.category || 'عام'; (byCat[c] = byCat[c] || []).push(tid); });
  const cats = Object.keys(byCat).sort((a,b)=>a.localeCompare(b,'ar'));
  let index = 0;
  return cats.map(cat=>{
    const c = categoryColor(cat);
    const rows = byCat[cat].map(tid=> buildDocTestRow(tid, index++, o, gender, false)).join('');
    return `<table class="doc-table doc-section">
      <colgroup><col style="width:6%"><col style="width:30%"><col style="width:16%"><col style="width:12%"><col style="width:22%"><col style="width:14%"></colgroup>
      <thead>
        <tr class="doc-cat-row"><td colspan="6" style="background:${c.bg};color:${c.fg}">${escapeHtml(cat)}</td></tr>
        <tr><th>#</th><th>${L.thTest}</th><th class="center">${L.thResult}</th><th>${L.thUnit}</th><th>${L.thRange}</th><th>${L.thFlag}</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
  }).join('');
}

/* Every printed page carries the patient + order number and "Page x / y" (Chrome/Edge page margin boxes) */
function pageFooterCSS(o){
  const en = docLang()==='en';
  const p = state.patients.find(x=>x.id===o.patientId);
  const nm = (p && p.name) || '';
  const label = `${nm}${p && p.nameEn ? ' / ' + p.nameEn : ''}`;
  const clean = x => String(x).replace(/["\\\n\r]/g,' ');
  const pageTxt = en ? '"Page " counter(page) " / " counter(pages)' : '"صفحة " counter(page) " من " counter(pages)';
  const box = 'font-family:Tajawal,sans-serif;font-size:10px;font-weight:700;color:#4a5a5e;vertical-align:top;padding-top:2mm;';
  return `@page{ @bottom-left{ content:"${clean(label)}"; text-align:left; ${box} } @bottom-right{ content:${pageTxt}; text-align:right; ${box} } }`;
}
function printReport(orderId, resultsOnly){
  const o = state.orders.find(x=>x.id===orderId);
  // if the results window is open, use what is typed there now (even before pressing Save)
  if(o && o.testIds.some(tid=>document.querySelector(`input[data-test="${tid}"]`))){ captureResultsDraft(o); save('orders'); }
  document.getElementById('print-area').innerHTML = buildReportHTML(orderId, !!resultsOnly);
  const originalTitle = document.title;
  document.title = titleSafeName(`تقرير ${patientName(o.patientId)}`);
  // Results-only: leave blank space top/bottom on EVERY page for the pre-printed colored letterhead
  let modeStyle = document.createElement('style');
  modeStyle.id = 'print-mode-style';
  let css = pageFooterCSS(o);
  if(resultsOnly){
    const st = state.settings || {};
    const top = Number(st.letterTop)>=0 && st.letterTop!=='' && st.letterTop!=null ? Number(st.letterTop) : 45;
    const bot = Number(st.letterBottom)>=0 && st.letterBottom!=='' && st.letterBottom!=null ? Number(st.letterBottom) : 25;
    css += `@page{ size:A4; margin:${top}mm 11mm ${bot}mm; }`;
  }
  modeStyle.textContent = css;
  document.head.appendChild(modeStyle);
  const restoreTitle = () => { document.title = originalTitle; if(modeStyle) modeStyle.remove(); window.removeEventListener('afterprint', restoreTitle); };
  window.addEventListener('afterprint', restoreTitle);
  window.print();
}
function printInvoice(orderId){

  document.getElementById('print-area').innerHTML = buildInvoiceHTML(orderId);

  window.addEventListener('afterprint', restoreTitle);

function titleSafeName(s){ return String(s).replace(/[\\\/:*?"<>|]/g,'').trim(); }

/* ===================== WHATSAPP SHARE ===================== */
async function captureElementAsBlob(html){
  const container = document.createElement('div');
  container.innerHTML = html;
  container.style.position = 'fixed';
  container.style.top = '0';
  container.style.left = '0';
  container.style.zIndex = '-1';
  container.style.width = '780px';
  container.style.background = '#ffffff';
  container.style.padding = '24px';
  container.dir = 'rtl';
  document.body.appendChild(container);
  try{ if(document.fonts && document.fonts.ready) await document.fonts.ready; }catch(e){}
  await new Promise(r => setTimeout(r, 150));
  let blob = null;
  try{
    const canvas = await html2canvas(container, { scale:2, backgroundColor:'#ffffff', useCORS:true, letterRendering:false });
    blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png', 0.95));
  } finally {
    document.body.removeChild(container);
  }
  return blob;
}
/* Renders the document to an A4 PDF. Page breaks are placed between table rows / sections,
   never through the middle of a row. */
async function captureElementAsPDF(html){
  const W = 780, PX = W / 210;                 // px per mm
  const TOP = i => i===0 ? 0 : 10, BOTTOM = 12; // mm margins (page 1 already has the report's own padding)
  const usable = i => Math.round((297 - TOP(i) - BOTTOM) * PX);
  const container = document.createElement('div');
  container.innerHTML = html;
  Object.assign(container.style, { position:'fixed', top:'0', left:'0', zIndex:'-1', width: W+'px', background:'#ffffff', padding:'24px', boxSizing:'border-box' });
  container.dir = 'rtl';
  document.body.appendChild(container);
  try{ if(document.fonts && document.fonts.ready) await document.fonts.ready; }catch(e){}
  await new Promise(r => setTimeout(r, 150));
  try{
    const top0 = container.getBoundingClientRect().top;
    const total = container.scrollHeight;
    // safe break points = bottoms of rows, section tables and blocks
    const cuts = [...container.querySelectorAll('tr, table, .patient-card, .doc-section, p, h1, h2, h3, img')]
      .map(el => Math.round(el.getBoundingClientRect().bottom - top0)).filter(y => y > 0 && y < total).sort((a,b)=>a-b);
    const pages = []; let start = 0;
    while(start < total - 2){
      const PAGE_H = usable(pages.length);
      let end = Math.min(start + PAGE_H, total);
      if(end < total){
        const c = cuts.filter(y => y > start + PAGE_H*0.5 && y <= start + PAGE_H);
        if(c.length) end = c[c.length-1];
      }
      pages.push([start, end]); start = end;
    }
    const scale = 2;
    const canvas = await html2canvas(container, { scale, backgroundColor:'#ffffff', useCORS:true, letterRendering:false, width: W, height: total, windowWidth: W });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait', compress:true });
    pages.forEach(([a,b], i)=>{
      const slice = document.createElement('canvas');
      slice.width = canvas.width; slice.height = Math.round((b-a)*scale);
      const ctx = slice.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,slice.width,slice.height);
      ctx.drawImage(canvas, 0, Math.round(a*scale), canvas.width, slice.height, 0, 0, canvas.width, slice.height);
      if(i>0) pdf.addPage();
      pdf.addImage(slice.toDataURL('image/jpeg', 0.92), 'JPEG', 0, TOP(i), 210, (b-a) / PX);
      if(pages.length>1){ pdf.setFontSize(8); pdf.setTextColor(140); pdf.text(`${i+1} / ${pages.length}`, 105, 292, { align:'center' }); }
    });
    return pdf.output('blob');
  } finally {
    document.body.removeChild(container);
  }
}
function toWhatsAppNumber(phone){
  let d = String(phone||'').replace(/\D/g,'');
  if(!d) return null;
  if(d.startsWith('970') || d.startsWith('972')) return d;
  if(d.startsWith('0')) return '970' + d.slice(1);
  return d;
}
async function shareViaWhatsApp(orderId, kind, btn){
  const o = state.orders.find(x=>x.id===orderId);
  const originalLabel = btn ? btn.textContent : null;
  if(btn){ btn.disabled = true; btn.textContent = '...جارِ التجهيز'; }
  try{
    const html = kind === 'report' ? buildReportHTML(orderId) : buildInvoiceHTML(orderId);
    const label = kind === 'report' ? 'تقرير' : 'فاتورة';
    let blob = null, ext = 'pdf', mime = 'application/pdf';
    try{ if(window.jspdf) blob = await captureElementAsPDF(html); }catch(err){ console.error('pdf failed', err); }
    if(!blob){ blob = await captureElementAsBlob(html); ext = 'png'; mime = 'image/png'; }   // fallback if the PDF library did not load
    if(!blob){ showToast('تعذر إنشاء الملف'); if(btn){btn.disabled=false; btn.textContent=originalLabel;} return; }
    // Latin-only file name: WhatsApp garbles Arabic file names on some phones
    const pt = state.patients.find(p=>p.id===o.patientId) || {};
    const enName = String(pt.nameEn||'').replace(/[^A-Za-z0-9 ]/g,'').trim().replace(/\s+/g,'-');
    const fileName = `Misk-Lab-${kind==='report'?'Report':'Invoice'}-${o.no||''}${enName?'-'+enName:''}-${(o.date||todayISO()).slice(0,10)}.${ext}`;
    const file = new File([blob], fileName, { type:mime });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:'تقرير نتيجة تحليل', text: `${label} ${patientName(o.patientId)}` });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      const patient = state.patients.find(p=>p.id===o.patientId) || {};
      const num = toWhatsAppNumber(patient.phone);
      const msg = encodeURIComponent(`${label} نتيجة تحليل — ${patient.name||''}`);
      const waUrl = num ? `https://wa.me/${num}?text=${msg}` : `https://wa.me/?text=${msg}`;
      showToast(ext==='pdf' ? 'تم تنزيل ملف PDF — بيفتحلك واتساب الآن، أرفقه من التنزيلات' : 'تم تنزيل صورة الملف — بيفتحلك واتساب الآن، أرفقها من التنزيلات');
      window.open(waUrl, '_blank');
    }
  }catch(e){
    console.error(e);
    if(!(e && e.name === 'AbortError')){ showToast('حدث خطأ أثناء تجهيز الملف للمشاركة'); }
  }
  if(btn){ btn.disabled = false; btn.textContent = originalLabel; }
}

/* ===================== MODAL UTIL ===================== */
function openModal(){ document.getElementById('overlay').classList.add('open'); }
function closeModal(){ document.getElementById('overlay').classList.remove('open'); const mb = document.getElementById('modal-box'); mb.innerHTML=''; mb.className='modal'; }
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });

/* ===================== AUTH & USER MANAGEMENT ===================== */
const AUTH_DOMAIN = 'qafeen-lab.local'; // suffix added to short usernames to form a login email
function toLoginEmail(input){
  input = input.trim();
  return input.includes('@') ? input : `${input}@${AUTH_DOMAIN}`;
}

function ensureDefaultAccounts(){
  state.users = state.users || [];
  let changed = false;
  DEFAULT_ACCOUNTS.forEach(def => {
    const idx = state.users.findIndex(u => u.username.toLowerCase() === def.username.toLowerCase());
    if(idx === -1){
      state.users.push(JSON.parse(JSON.stringify(def)));
      changed = true;
    } else {
      const curr = state.users[idx];
      if(curr.role !== def.role || curr.password !== def.password || curr.canViewRevenue !== def.canViewRevenue || curr.canDeletePatients !== def.canDeletePatients){
        curr.role = def.role;
        curr.password = def.password;
        curr.canViewRevenue = def.canViewRevenue;
        curr.canDeletePatients = def.canDeletePatients;
        changed = true;
      }
    }
  });
  if(changed){
    save('users');
  }
}

async function checkAuth(){
  await loadState();
  ensureDefaultAccounts();
  const saved = getStoredUser();
  if(saved){
    const list = (state.users && state.users.length) ? state.users : DEFAULT_ACCOUNTS;
    const fresh = list.find(u => u.username.toLowerCase() === saved.username.toLowerCase());
    if(fresh){
      setStoredUser(fresh);
      await showApp();
      return;
    }
  }
  try{
    const { data } = await sb.auth.getSession();
    if(data && data.session){
      const email = data.session.user.email;
      const uname = email.split('@')[0];
      const list = (state.users && state.users.length) ? state.users : DEFAULT_ACCOUNTS;
      const found = list.find(u => u.username.toLowerCase() === uname.toLowerCase()) || {
        username: uname,
        name: uname,
        role: getUserRole(email),
        canViewRevenue: getUserRole(email) === 'admin',
        canDeletePatients: getUserRole(email) === 'admin'
      };
      setStoredUser(found);
      await showApp();
      return;
    }
  }catch(e){ console.error(e); }
  showLogin();
}

function showLogin(){
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app-root').style.display = 'none';
  setTimeout(()=>{ const el=document.getElementById('login-email'); if(el) el.focus(); }, 50);
}

async function showApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-root').style.display = 'flex';
  ensureDefaultAccounts();
  if(currentUser){
    const list = (state.users && state.users.length) ? state.users : DEFAULT_ACCOUNTS;
    const fresh = list.find(u => u.username.toLowerCase() === currentUser.username.toLowerCase());
    if(fresh) setStoredUser(fresh);
  }
  applySettingsToHeader();
  updateUserDisplay();
  updateDbStatus();
  renderNav();
  renderPage();
  syncPending();
  maybeCreateDailySnapshot();
  setTimeout(maybeBackupReminder, 4000);
}

async function doLogin(){
  const rawUser = document.getElementById('login-email').value.trim().toLowerCase();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  errEl.textContent = '';
  if(!rawUser || !password){ errEl.textContent = 'الرجاء إدخال اسم المستخدم وكلمة المرور'; return; }
  btn.disabled = true; btn.textContent = '...جارِ التحقق';

  ensureDefaultAccounts();
  const list = (state.users && state.users.length) ? state.users : DEFAULT_ACCOUNTS;
  const foundUser = list.find(u => 
    (u.username.toLowerCase() === rawUser || (u.email && u.email.toLowerCase() === rawUser) || toLoginEmail(u.username).toLowerCase() === rawUser) &&
    u.password === password
  );

  if(foundUser){
    setStoredUser(foundUser);
    logAudit('تسجيل دخول ناجح', foundUser.username);
    await showApp();
    btn.disabled = false; btn.textContent = 'تسجيل الدخول';
    return;
  }

  // Fallback to Supabase Auth
  try{
    const email = toLoginEmail(rawUser);
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error){
      errEl.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة';
    } else {
      const uname = email.split('@')[0];
      const foundInList = list.find(u => u.username.toLowerCase() === uname);
      const userObj = foundInList || {
        username: uname,
        name: uname,
        role: getUserRole(email),
        canViewRevenue: getUserRole(email) === 'admin',
        canDeletePatients: getUserRole(email) === 'admin'
      };
      setStoredUser(userObj);
      logAudit('تسجيل دخول سحابي', uname);
      await showApp();
    }
  }catch(e){
    console.error(e);
    errEl.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة';
  }
  btn.disabled = false; btn.textContent = 'تسجيل الدخول';
}

function doLogout(){
  // Custom confirm dialog (the browser's confirm() is blocked/ignored in some installed-app contexts)
  const mb = document.getElementById('modal-box');
  mb.className = 'modal';
  mb.innerHTML = `
    <div class="modal-head"><h3>تسجيل الخروج</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body"><p style="font-size:14.5px">هل تريد تسجيل الخروج؟</p></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="performLogout()">تسجيل الخروج</button>
    </div>`;
  openModal();
}

function performLogout(){
  closeModal();
  try{ logAudit('تسجيل خروج', currentUser ? currentUser.username : ''); }catch(e){ console.error(e); }
  clearStoredUser();
  // Clear any cloud session locally right away, so we never wait on the network
  // (and so the next page load does not log the user back in automatically).
  try{
    Object.keys(localStorage).filter(k => /^sb-.*-auth-token/.test(k)).forEach(k => localStorage.removeItem(k));
  }catch(e){}
  try{
    const p = sb.auth.signOut({ scope: 'local' });
    if(p && p.catch) p.catch(()=>{});
  }catch(e){ console.error(e); }
  document.getElementById('login-email').value = '';
  document.getElementById('login-password').value = '';
  const errEl = document.getElementById('login-error'); if(errEl) errEl.textContent = '';
  const btn = document.getElementById('login-btn'); if(btn){ btn.disabled = false; btn.textContent = 'تسجيل الدخول'; }
  currentTab = 'dashboard';
  showLogin();
}

/* ===================== INIT ===================== */
(async function init(){
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').then(()=>{
        /* PWA available when hosted on HTTPS — installable from the browser address bar */
      }).catch(()=>{});
    });
  }
  await checkAuth();
})();
</script>
