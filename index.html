<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0E5E59">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مختبر مسك">
<title>نظام إدارة المختبر</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Zain:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#12262B;
    --ink-soft:#3E5459;
    --paper:#F4F7F6;
    --card:#FFFFFF;
    --primary:#0E5E59;
    --primary-dark:#0A4642;
    --primary-light:#E4EFEE;
    --accent:#B8722E;
    --accent-dark:#8A5A22;
    --accent-light:#F5E9DA;
    --danger:#A23B3B;
    --danger-light:#F5E3E1;
    --success:#3F7D5C;
    --success-light:#E4F0E9;
    --info:#3A5A9C;
    --info-light:#E4EBF5;
    --line:#DCE3E1;
    --sidebar:#082623;
    --sidebar-hover:#0F3B36;
    --sidebar-active:#0E5E59;
    --sidebar-text:#9FC4BE;
    --radius:10px;
  }
  html[data-theme="dark"]{
    color-scheme: dark;
    --ink:#E6EEEC;
    --ink-soft:#9FB5AF;
    --primary-dark:#69C2BB;
    --paper:#0F1B1C;
    --card:#162426;
    --primary-light:#1D3437;
    --accent-light:#3A2A1A;
    --danger-light:#3A1F1F;
    --success-light:#1E3529;
    --info-light:#1F2B44;
    --line:#2E4246;
    --sidebar:#04130F;
    --sidebar-hover:#0B2C26;
    --sidebar-active:#0E5E59;
    --sidebar-text:#9FC4BE;
  }
  html[data-theme="dark"] .search-input,
  html[data-theme="dark"] .select-input,
  html[data-theme="dark"] .text-input,
  html[data-theme="dark"] textarea{ color-scheme:dark; }
  html[data-theme="dark"] .badge-low{ background:#26314F; color:#A9BDF0; }
  html[data-theme="dark"] .result-value-input.flag-high,
  html[data-theme="dark"] .result-value-input.flag-low{ background:#3A3113; border-color:#8A7A36; color:#EFD98A; }
  html[data-theme="dark"] .result-value-input.flag-critical-high,
  html[data-theme="dark"] .result-value-input.flag-critical-low{ background:#3A1C1A; border-color:#944540; color:#F5A9A2; }
  html[data-theme="dark"] .result-value-input.flag-normal{ background:#173125; border-color:#2E6B4D; color:#A9E3C5; }
  *{box-sizing:border-box; margin:0; padding:0;}
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:var(--paper); }
  ::-webkit-scrollbar-thumb{ background:rgba(8,38,35,.22); border-radius:8px; border:2px solid var(--paper); }
  ::-webkit-scrollbar-thumb:hover{ background:var(--primary); }
  *{ scrollbar-width:thin; scrollbar-color:rgba(8,38,35,.25) var(--paper); }
  body{
    font-family:'Tajawal', sans-serif;
    background:var(--paper);
    color:var(--ink);
    font-size:15px;
    line-height:1.6;
  }
  .app{ display:flex; min-height:100vh; }

  /* ===== Sidebar ===== */
  .sidebar{
    width:236px; flex-shrink:0;
    background:
      radial-gradient(circle at 18px 18px, rgba(255,255,255,.05) 1.5px, transparent 1.5px) 0 0/22px 22px,
      linear-gradient(170deg, rgba(255,255,255,.055), rgba(255,255,255,0) 32%),
      var(--sidebar);
    color:var(--sidebar-text);
    display:flex; flex-direction:column;
    padding:22px 0;
    box-shadow:inset -1px 0 0 rgba(255,255,255,.04);
  }
  .brand{
    padding:0 20px 20px 20px;
    border-bottom:1px solid rgba(255,255,255,.08);
    margin-bottom:16px;
  }
  .brand .mark{
    display:flex; align-items:center; gap:11px;
  }
  .brand .mark img{ flex-shrink:0; }
  .brand .mark > img{
    background:#fff; object-fit:contain;
    border-radius:10px; padding:4px; width:36px; height:36px;
    box-shadow:0 3px 10px rgba(0,0,0,.25);
  }
  .brand h1{
    font-family:'Zain', sans-serif;
    font-size:20px; font-weight:800; color:#fff; letter-spacing:.3px;
  }
  .brand p{ font-size:12px; color:var(--sidebar-text); margin-top:4px; opacity:.8; }
  nav{ display:flex; flex-direction:column; gap:3px; padding:0 12px; flex:1; }
  .nav-item{
    display:flex; align-items:center; gap:12px;
    padding:11px 14px; border-radius:9px;
    color:var(--sidebar-text); cursor:pointer;
    font-size:14.5px; font-weight:500;
    transition:background .12s ease, color .12s ease;
    user-select:none; position:relative;
  }
  .nav-item svg{ flex-shrink:0; opacity:.85; transition:opacity .12s ease; }
  .nav-item:hover{ background:var(--sidebar-hover); color:#fff; }
  .nav-item.active{ background:linear-gradient(90deg, rgba(14,94,89,.55), var(--sidebar-active)); color:#fff; font-weight:700; box-shadow:0 3px 10px rgba(0,0,0,.18), inset 0 0 0 1px rgba(255,255,255,.05); }
  .nav-item.active svg{ opacity:1; color:var(--accent); stroke:var(--accent); }
  .nav-item.active::before{
    content:''; position:absolute; inset-inline-start:-12px; top:50%; transform:translateY(-50%);
    width:4px; height:18px; border-radius:0 4px 4px 0; background:var(--accent);
  }
  .sidebar-foot{
    padding:12px 20px 0 20px; margin-top:10px;
    border-top:1px solid rgba(255,255,255,.08);
  }
  .sidebar-foot .nav-item{ color:var(--sidebar-text); }

  /* ===== Main ===== */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    background:var(--card); border-bottom:1px solid var(--line);
    padding:18px 28px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:5;
    box-shadow:0 2px 14px rgba(8,38,35,.05), inset 0 -3px 0 0 var(--primary-light);
  }
  .topbar h2{ font-size:20px; font-weight:800; }
  .topbar .sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; font-weight:400; }
  .content{ padding:24px 28px 60px 28px; flex:1; }

  /* ===== Buttons ===== */
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 18px; border-radius:8px; border:none;
    font-family:inherit; font-size:14px; font-weight:700;
    cursor:pointer; transition:filter .1s ease, transform .05s ease;
    white-space:nowrap;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--primary); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-outline{ background:transparent; color:var(--primary); border:1.5px solid var(--primary); }
  .btn-outline:hover{ background:var(--primary-light); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); }
  .btn-ghost:hover{ background:var(--primary-light); }
  .btn-danger{ background:transparent; color:var(--danger); }
  .btn-danger:hover{ background:var(--danger-light); }
  .btn-sm{ padding:6px 12px; font-size:12.5px; border-radius:6px; }
  .btn-print{ background:linear-gradient(135deg, #0E5E59, #0A4642); color:#fff; box-shadow:0 4px 12px rgba(14,94,89,.25); }
  .btn-print:hover{ filter:brightness(1.1); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  /* ===== Cards / stats ===== */
  .stats-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
  .stat-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px 20px 18px 22px; position:relative; overflow:hidden;
    border-inline-start:4px solid var(--primary);
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    box-shadow:0 3px 12px rgba(8,38,35,.06);
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .stat-card::before{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(circle at 8px 50%, rgba(14,94,89,.10), transparent 52%);
  }
  .stat-card:hover{ transform:translateY(-3px); box-shadow:0 12px 26px rgba(8,38,35,.12); }
  .stat-card.stat-amber{ border-inline-start-color:var(--accent); }
  .stat-card.stat-success{ border-inline-start-color:var(--success); }
  .stat-card.stat-danger{ border-inline-start-color:var(--danger); }
  .stat-card .stat-body{ min-width:0; }
  .stat-card .label{ font-size:12.5px; color:var(--ink-soft); font-weight:700; }
  .stat-card .value{ font-size:34px; font-weight:900; margin-top:6px; color:var(--primary-dark); font-family:'Zain',sans-serif; }
  .stat-card .value.accent{ color:var(--accent); }
  .stat-card .value.danger{ color:var(--danger); }
  .stat-card .foot{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }
  .stat-card .stat-icon{
    flex-shrink:0; width:44px; height:44px; border-radius:12px;
    background:var(--primary-light); color:var(--primary-dark);
    display:flex; align-items:center; justify-content:center;
  }
  .stat-card.stat-amber .stat-icon{ background:var(--accent-light); color:var(--accent-dark); }
  .stat-card.stat-success .stat-icon{ background:var(--success-light); color:var(--success); }
  .stat-card.stat-danger .stat-icon{ background:var(--danger-light); color:var(--danger); }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:0 2px 10px rgba(8,38,35,.05); }
  .card-head{
    padding:16px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .card-head h3{ font-size:15.5px; font-weight:800; }
  .card-body{ padding:18px 20px; }

  .toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .search-input, .select-input, .text-input, textarea{
    border:1.5px solid var(--line); border-radius:8px; padding:9px 13px;
    font-family:inherit; font-size:14px; background:var(--card); color:var(--ink);
    width:100%;
  }
  .search-input:focus, .select-input:focus, .text-input:focus, textarea:focus{
    outline:none; border-color:var(--primary);
  }
  .toolbar .search-input{ max-width:260px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field-row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }

  table{ width:100%; border-collapse:collapse; }
  th{ text-align:start; font-size:12px; color:var(--ink-soft); font-weight:700; padding:8px 12px; border-bottom:1.5px solid var(--line); white-space:nowrap; }
  td{ padding:12px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--primary-light); }
  .empty-row td{ text-align:center; color:var(--ink-soft); padding:40px; font-size:13.5px; }

  .badge{ display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; font-size:11.5px; font-weight:800; }
  .badge-pending{ background:var(--accent-light); color:var(--accent); }
  .badge-completed{ background:var(--success-light); color:var(--success); }
  .badge-paid{ background:var(--success-light); color:var(--success); }
  .badge-unpaid{ background:var(--danger-light); color:var(--danger); }
  .badge-normal{ background:var(--success-light); color:var(--success); }
  .badge-high{ background:var(--danger-light); color:var(--danger); }
  .badge-low{ background:#E4EBF5; color:#3A5A9C; }
  .badge-critical{ background:var(--danger); color:#fff; font-weight:900; box-shadow:0 0 0 2px var(--danger-light); }

  .cat-chip{
    display:inline-flex; align-items:center; padding:6px 14px; border-radius:20px;
    font-size:12.5px; font-weight:700; cursor:pointer; user-select:none;
    border:1.5px solid var(--line); background:var(--card); color:var(--ink-soft);
    transition:filter .1s ease, transform .05s ease;
  }
  .cat-chip:hover{ filter:brightness(0.97); }
  .cat-chip:active{ transform:translateY(1px); }
  .cat-chip.active{ font-weight:900; box-shadow:0 1px 4px rgba(0,0,0,.12); }

  .test-group{ border:1px solid var(--line); border-radius:9px; margin-bottom:12px; overflow:hidden; }
  .test-group-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 16px; background:linear-gradient(180deg, var(--primary-light), var(--card) 72%); cursor:pointer; user-select:none;
  }
  .test-group-head:hover{ background:var(--primary-light); }
  .test-group-chevron{ display:flex; color:var(--ink-soft); transition:transform .15s ease; }
  .test-group-chevron.open{ transform:rotate(180deg); color:var(--primary); }
  .test-group-table{ width:100%; border-collapse:collapse; }
  .test-group-table thead th{ font-size:11.5px; color:var(--ink-soft); font-weight:700; padding:8px 16px; border-top:1px solid var(--line); background:var(--paper); text-align:start; }
  .test-group-table tbody td{ padding:10px 16px; border-top:1px solid var(--line); font-size:13px; }
  .test-group-table tbody tr:hover td{ background:var(--primary-light); }

  .order-cat-group{ border:1px solid var(--line); border-radius:8px; margin-bottom:8px; overflow:hidden; }
  .order-cat-group summary{
    list-style:none; cursor:pointer; user-select:none;
    display:flex; align-items:center; gap:9px;
    padding:9px 14px; background:linear-gradient(180deg, var(--primary-light), var(--card) 72%); font-size:13px;
  }
  .order-cat-group summary::-webkit-details-marker{ display:none; }
  .order-cat-group summary:hover{ background:var(--primary-light); }
  .order-cat-arrow{ transition:transform .15s ease; color:var(--ink-soft); flex-shrink:0; }
  .order-cat-group[open] .order-cat-arrow{ transform:rotate(180deg); color:var(--primary); }
  .order-cat-body{ padding:4px 4px; }
  .order-cat-body .check-item{ margin:4px 8px; }

  .row-actions{ display:flex; gap:6px; }
  .num{ font-family:'Zain',sans-serif; font-weight:700; }

  /* ===== Modal ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(12,30,28,.45);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .overlay.open{ display:flex; }
  @keyframes modalPop{ from{ opacity:0; transform:translateY(14px) scale(.985); } to{ opacity:1; transform:none; } }
  .modal{
    background:var(--card); border-radius:14px; width:100%; max-width:560px;
    max-height:88vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.25);
    animation:modalPop .22s ease;
  }
  .modal.wide{ max-width:760px; }
  .modal.modal-xl{ max-width:980px; }
  .modal-head{
    padding:18px 22px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:var(--card);
  }
  .modal-head h3{ font-size:16.5px; font-weight:800; }
  .modal-close{ cursor:pointer; color:var(--ink-soft); font-size:20px; line-height:1; background:none; border:none; padding:4px; }
  .modal-body{ padding:20px 22px; }
  .modal-foot{ padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; }

  .checklist{ display:flex; flex-direction:column; gap:6px; max-height:280px; overflow-y:auto; border:1px solid var(--line); border-radius:8px; padding:8px; }
  .check-item{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:6px; font-size:13.5px; }

  /* Searchable test picker (typeahead) used in the "new order" flow */
  .test-picker{ position:relative; }
  .test-suggestions{
    display:none; position:absolute; z-index:40; top:calc(100% + 4px); right:0; left:0;
    background:var(--card); border:1px solid var(--line); border-radius:9px; box-shadow:0 8px 24px rgba(0,0,0,.12);
    max-height:260px; overflow-y:auto; padding:6px;
  }
  .test-suggestions.open{ display:block; }
  .suggestion-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:7px; cursor:pointer; font-size:13px;
  }
  .suggestion-item:hover{ background:var(--primary-light); }
  .suggestion-empty{ padding:10px; font-size:12.5px; color:var(--ink-soft); text-align:center; }
  .selected-tests-list{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  .test-chip{
    display:flex; align-items:center; gap:10px; padding:8px 10px;
    border:1px solid var(--line); border-radius:8px; background:var(--card);
  }
  .test-chip .chip-name{ flex:1; font-weight:700; font-size:13.5px; }
  .test-chip .chip-cat{ font-size:11px; color:var(--ink-soft); background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:2px 9px; flex-shrink:0; }
  .test-chip .chip-price{ width:85px; padding:6px 8px; font-size:12.5px; border:1px solid var(--line); border-radius:6px; text-align:center; flex-shrink:0; }
  .test-chip .chip-remove{
    flex-shrink:0; width:24px; height:24px; border-radius:50%; border:none; background:var(--danger-light); color:var(--danger);
    font-size:15px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .test-chip .chip-remove:hover{ background:var(--danger); color:#fff; }
  .check-item:hover{ background:var(--paper); }
  .check-item .ci-price{ margin-inline-start:auto; color:var(--ink-soft); font-size:12.5px; }

  .result-row{ display:grid; grid-template-columns:1.6fr 1fr .9fr 1fr; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .result-row:last-child{ border-bottom:none; }
  .result-row .rname{ font-weight:700; font-size:13.5px; }
  .result-row .rref{ font-size:11.5px; color:var(--ink-soft); }

  /* Results entry, grouped by category — same visual language as the tests catalog & printed docs */
  .result-group{ border:1px solid var(--line); border-radius:10px; margin-bottom:14px; overflow:hidden; }
  .result-group-head{ display:flex; align-items:center; gap:9px; padding:10px 14px; font-size:13px; font-weight:800; position:relative; }
  .result-group-head::after{ content:''; position:absolute; inset:0; pointer-events:none; background:linear-gradient(115deg, rgba(255,255,255,.32), transparent 46%); }
  .result-group-head > *{ position:relative; z-index:1; }
  .result-group-rows{ padding:2px 14px 10px; }
  .result-row-grid{ display:grid; grid-template-columns:1.7fr 1.1fr .8fr 1.3fr 1fr; gap:10px; align-items:center; padding:9px 0; border-top:1px solid var(--line); }
  .result-row-grid:first-child{ border-top:none; }
  .result-row-grid .rname{ font-weight:700; font-size:13px; }
  .result-row-grid .rref{ font-size:11px; color:var(--ink-soft); margin-top:1px; }
  .result-value-input{
    width:100%; padding:8px 10px; border:1.5px solid var(--line); border-radius:7px;
    font-size:13.5px; font-weight:700; font-family:'Zain',sans-serif; text-align:center;
    transition:background .15s ease, border-color .15s ease;
  }
  .result-value-input.flag-high, .result-value-input.flag-low{ background:#FCF3D9; border-color:#E9CE7A; color:#8A5A22; }
  .result-value-input.flag-critical-high, .result-value-input.flag-critical-low{ background:#FBE2DF; border-color:#E7A9A2; color:#A23B3B; }
  .result-value-input.flag-normal{ background:#EFF8F3; border-color:#BFE0CC; color:#245C3C; }
  @media (max-width:640px){ .result-row-grid{ grid-template-columns:1fr; gap:4px; } }

  .total-line{ display:flex; justify-content:space-between; padding:8px 0; font-size:14px; }
  .total-line.grand{ font-weight:900; font-size:17px; color:var(--primary-dark); border-top:1.5px solid var(--line); margin-top:6px; padding-top:12px; }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
  .empty-state svg{ margin-bottom:14px; opacity:.5; }
  .empty-state p{ font-size:14px; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:12px 22px; border-radius:8px; font-size:13.5px;
    opacity:0; transition:all .25s ease; z-index:100; pointer-events:none; font-weight:600;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .bar-row .bar-label{ width:150px; font-size:12.5px; flex-shrink:0; }
  .bar-track{ flex:1; height:10px; background:var(--primary-light); border-radius:6px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--primary); border-radius:6px; }
  .bar-row .bar-val{ width:40px; text-align:end; font-size:12.5px; font-weight:700; color:var(--ink-soft); flex-shrink:0; }

  #print-area{ display:none; }

  /* ===== Login ===== */
  .login-wrap{
    position:fixed; inset:0; background:linear-gradient(160deg, var(--sidebar) 0%, var(--primary-dark) 55%, var(--primary) 100%);
    display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;
  }
  .login-card{
    background:var(--card); border-radius:16px; padding:34px 32px; width:100%; max-width:380px; text-align:center;
    box-shadow:0 24px 70px rgba(0,0,0,.28), inset 0 0 0 1px rgba(255,255,255,.04);
  }
  .login-mark{ display:flex; justify-content:center; margin-bottom:14px; }
  .login-card h1{ font-family:'Zain',sans-serif; font-size:22px; font-weight:800; color:var(--primary-dark); margin-bottom:6px; }
  .login-card p{ font-size:13px; color:var(--ink-soft); margin-bottom:22px; }
  .login-card .field{ text-align:start; }
  .login-error{ color:var(--danger); font-size:12.5px; margin-bottom:12px; min-height:16px; }

  @page{ size:A4; margin:9mm 11mm; }
  @media print{
    html, body{ height:auto !important; overflow:visible !important; background:#fff !important; margin:0 !important; padding:0 !important; }
    body > *:not(#print-area){ display:none !important; }
    #print-area{ display:block !important; position:static !important; padding:0; margin:0; }
    .no-print{ display:none !important; }
  }
  /* ===== Unified report / invoice template ("lab-doc") ===== */
  .lab-doc{direction:var(--doc-dir,rtl);font-family:'Tajawal',sans-serif;color:#12262B;background:#fff;max-width:900px;margin:0 auto;position:relative;}

  /* Masthead (letterhead) — lab identity only, no WhatsApp here */
  .doc-masthead{display:flex;align-items:center;gap:16px;padding:22px 26px;border-radius:14px 14px 0 0;background:linear-gradient(135deg,#0E5E59 0%,#0A4642 100%);color:#fff;position:relative;overflow:hidden;}
  .doc-masthead::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 100% -20%, rgba(255,255,255,.16), transparent 55%);pointer-events:none;}
.doc-logo{width:88px;height:88px;border-radius:18px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1;overflow:hidden;padding:10px;box-sizing:border-box;}
.doc-logo svg{width:60px;height:60px;}
  .doc-brand{position:relative;z-index:1;}
.doc-brand h1{font-size:27px;font-weight:900;letter-spacing:0;margin:0;}
  .lab-doc, .lab-doc *{letter-spacing:0 !important;text-shadow:none !important;font-variant-ligatures:normal;}
.doc-brand p{font-size:12.5px;opacity:.85;margin-top:3px;}
.doc-brand .doc-brand-en{font-size:18px;font-weight:800;margin-top:2px;opacity:.95;font-family:'Tajawal',sans-serif;}

  /* Sub-bar BELOW the masthead: address + WhatsApp badge */
  .doc-subbar{display:flex;justify-content:center;align-items:center;gap:22px;flex-wrap:wrap;background:#F7FAF9;border:1px solid #DCE3E1;border-top:none;border-radius:0 0 14px 14px;padding:9px 16px;font-size:11.5px;color:#4A5F63;margin-bottom:18px;}
  .doc-subbar .wa-chip{display:inline-flex;align-items:center;gap:5px;font-weight:800;color:#0A4642;background:#E7F8F0;border:1px solid #BFE6CE;border-radius:20px;padding:3px 10px;}

  .doc-title{margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #0E5E59;padding-bottom:10px;}
  .doc-title h2{font-size:20px;color:#0A4642;font-weight:900;}
  .doc-badge{background:#E4EFEE;color:#0A4642;border:1px solid #BFD9D5;border-radius:20px;padding:5px 14px;font-size:11.5px;font-weight:800;}

  .doc-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
  .doc-meta-box{background:#F7FAF9;border:1px solid #DCE3E1;border-radius:8px;padding:8px 11px;font-size:12px;}
  .doc-meta-box span{display:block;color:#718186;font-size:10.5px;margin-bottom:1px;}
  .doc-meta-box strong{font-size:13px;color:#203A3E;}

  .patient-card{border:1px solid #DCE3E1;border-radius:9px;padding:12px 14px;margin-bottom:18px;background:#fff;}
  .patient-card-title{font-size:13px;font-weight:900;color:#0E5E59;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #E8EEEC;}
  .patient-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1.5fr;gap:12px;}
  .patient-grid div{font-size:12.5px;}
  .patient-grid span{color:#718186;font-size:10.5px;display:block;}
  .patient-grid strong{color:#203A3E;}

  .doc-table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid #DCE3E1;border-radius:9px;margin-bottom:16px;}
  .doc-table th{background:#0E5E59;color:#fff;font-size:11.8px;padding:10px 10px;text-align:right;white-space:nowrap;}
  .doc-table td{padding:9px 10px;font-size:12.5px;border-top:1px solid #E4EAE8;text-align:right;}
  .doc-table tr:nth-child(even) td{background:#F8FAF9;}
  .doc-table .center{text-align:center;font-weight:700;}
  .doc-table .price-col{text-align:left;white-space:nowrap;font-weight:800;}
  .doc-table tr.flag-critical td{background:#FBE8E6 !important;font-weight:800;color:#A23B3B;}
  .doc-table tr.doc-cat-row td{font-size:11.5px;font-weight:800;padding:6px 10px;border-top:2px solid rgba(0,0,0,.08);}

  .doc-summary{display:flex;justify-content:flex-end;margin-top:4px;margin-bottom:6px;}
  .doc-summary-box{width:320px;border:1px solid #DCE3E1;border-radius:9px;overflow:hidden;}
  .doc-summary-row{display:flex;justify-content:space-between;padding:8px 12px;font-size:12.5px;border-bottom:1px solid #E8EEEC;}
  .doc-summary-row.total{background:#E4EFEE;color:#0A4642;font-size:16px;font-weight:900;border-bottom:0;}
  .doc-summary-row.payment{font-weight:800;}
  .paid{color:#3F7D5C;} .unpaid{color:#A23B3B;}

  .doc-signature{margin-top:34px;display:flex;direction:ltr;justify-content:flex-start;}   /* always on the left side of the page */
  .doc-signature > div{direction:var(--doc-dir,rtl);text-align:center;min-width:220px;border-top:1px solid #999;padding-top:8px;}

  .doc-footer{margin-top:22px;text-align:center;border-top:1px solid #DCE3E1;padding-top:10px;color:#6A7B7F;font-size:11px;}
  .doc-footer strong{display:block;color:#0E5E59;font-size:12px;margin-bottom:2px;}

  /* Larger text for the results report (scale comes from Settings -> --rs) */
  .lab-doc.is-report .doc-table th{ font-size:calc(11.8px * var(--rs,1.3)); padding:calc(8px * var(--rs,1.3)) calc(8px * var(--rs,1.3)); }
  .lab-doc.is-report .doc-table td{ font-size:calc(12.5px * var(--rs,1.3)); padding:calc(7px * var(--rs,1.3)) calc(8px * var(--rs,1.3)); }
  .lab-doc.is-report .doc-table .center{ font-size:calc(13px * var(--rs,1.3)); }
  .lab-doc.is-report .doc-table tr.doc-cat-row td{ font-size:calc(12px * var(--rs,1.3)); padding:calc(6px * var(--rs,1.3)) calc(8px * var(--rs,1.3)); }
  .lab-doc.is-report .patient-card-title{ font-size:calc(13px * var(--rs,1.3)); }
  .lab-doc.is-report .patient-grid div{ font-size:calc(12.5px * var(--rs,1.3)); }
  .lab-doc.is-report .patient-grid span{ font-size:calc(10.5px * var(--rs,1.3)); }
  .lab-doc.is-report .doc-title h2{ font-size:calc(20px * var(--rs,1.3)); }
  .lab-doc.is-report .doc-badge{ font-size:calc(11.5px * var(--rs,1.3)); }
  .lab-doc.is-report .doc-meta-box{ font-size:calc(12px * var(--rs,1.3)); }
  .lab-doc.is-report .doc-meta-box span{ font-size:calc(10.5px * var(--rs,1.3)); }
  .lab-doc.is-report .doc-meta-box strong{ font-size:calc(13px * var(--rs,1.3)); }
  .lab-doc.is-report .doc-table th{ white-space:normal; }

  /* Report layout rules: keep sections/rows together, normal values regular, abnormal values bold */
  .lab-doc.is-report .doc-section{ table-layout:fixed; break-inside:avoid; page-break-inside:avoid; }
  .lab-doc .doc-table tr{ break-inside:avoid; page-break-inside:avoid; }
  .lab-doc .doc-table thead{ display:table-header-group; }
  .lab-doc .doc-signature, .lab-doc .doc-footer{ break-inside:avoid; page-break-inside:avoid; }
  .lab-doc.is-report .doc-table td.center{ font-weight:500; }
  .lab-doc.is-report .doc-table td.center.abn{ font-weight:900; }

  @media print{
    .lab-doc{max-width:none;}
    .doc-masthead{border-radius:0;}
    .doc-subbar{border-radius:0;}

    /* ===== Compact results report: more tests per page, fewer wasted pages ===== */
    .lab-doc.is-report{ line-height:1.3; }
    /* allow a long section to continue on the next page (header row repeats) instead of jumping whole to a new page */
    .lab-doc.is-report .doc-section{ break-inside:auto !important; page-break-inside:auto !important; overflow:visible !important; border-radius:0 !important; margin-bottom:calc(8px * var(--rs,1)) !important; }
    .lab-doc.is-report .doc-table tr{ break-inside:avoid; page-break-inside:avoid; }
    .lab-doc.is-report .doc-table thead{ display:table-header-group; }
    .lab-doc.is-report .doc-table tfoot{ display:table-footer-group; }
    .lab-doc.is-report .doc-table th{ padding:calc(3px * var(--rs,1)) calc(6px * var(--rs,1)) !important; }
    .lab-doc.is-report .doc-table td{ padding:calc(2.5px * var(--rs,1)) calc(6px * var(--rs,1)) !important; }
    .lab-doc.is-report .doc-table tr.doc-cat-row td{ padding:calc(3px * var(--rs,1)) calc(6px * var(--rs,1)) !important; }
    .lab-doc.is-report .doc-title{ margin:0 0 calc(6px * var(--rs,1)); padding-bottom:calc(5px * var(--rs,1)); }
    .lab-doc.is-report .doc-title h2{ font-size:calc(15px * var(--rs,1)); }
    .lab-doc.is-report .doc-meta{ gap:6px; margin-bottom:calc(6px * var(--rs,1)); }
    .lab-doc.is-report .doc-meta-box{ padding:calc(3px * var(--rs,1)) calc(8px * var(--rs,1)); }
    .lab-doc.is-report .patient-card{ padding:calc(5px * var(--rs,1)) calc(9px * var(--rs,1)); margin-bottom:calc(8px * var(--rs,1)); }
    .lab-doc.is-report .patient-card-title{ margin-bottom:calc(4px * var(--rs,1)); padding-bottom:calc(3px * var(--rs,1)); }
    .lab-doc.is-report .patient-grid{ gap:8px; }
    .lab-doc.is-report .doc-signature{ margin-top:calc(14px * var(--rs,1)); }
    .lab-doc.is-report .doc-disclaimer{ font-size:calc(9.5px * var(--rs,1)) !important; padding:calc(5px * var(--rs,1)) calc(10px * var(--rs,1)) !important; margin:calc(8px * var(--rs,1)) 0 2px !important; line-height:1.5 !important; }
  }

  @media (max-width: 900px){
    .stats-grid{ grid-template-columns:repeat(2,1fr); }
    .field-row, .field-row3{ grid-template-columns:1fr; }
    .result-row{ grid-template-columns:1fr; gap:4px; }
  }
</style>
</head>
<body>

<script>
/* PWA install */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('install-app-btn');
  if(btn) btn.style.display = '';
});
window.addEventListener('appinstalled', ()=>{
  const btn = document.getElementById('install-app-btn');
  if(btn) btn.style.display = 'none';
  deferredPrompt = null;
  showToast('تم تثبيت التطبيق بنجاح');
});
function installApp(){
  if(!deferredPrompt) {
    showToast('للتثبيت: من قائمة المتصفح اختر «إضافة إلى الشاشة الرئيسية» (آيفون: زر المشاركة ثم «إضافة إلى الشاشة الرئيسية»)');
    return;
  }
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(choice=>{ if(choice.outcome==='accepted'){ const b=document.getElementById('install-app-btn'); if(b) b.style.display='none'; } deferredPrompt=null; });

async function loadState(){
  for(const k of DATA_KEYS){
    if(hasPending(k)){
      // local changes not yet synced — trust local copy, don't overwrite with (stale) cloud data
      const raw = localStorage.getItem(LS_PREFIX+k);

    }
    try{
      const { data, error } = await sb.from('lab_data').select('value, updated_at').eq('key', k).maybeSingle();
      if(error) throw error;
      if(data && data.value != null){

        setBase(k, data.value);
        cloudStamp[k] = Date.parse(data.updated_at);
        cloudConnected = true;
      } else {
        const raw = localStorage.getItem(LS_PREFIX+k);
        if(raw) state[k] = JSON.parse(raw);
      }
    }catch(e){
      console.error('cloud load failed for', k, e);
      const raw = localStorage.getItem(LS_PREFIX+k);
      if(raw) state[k] = JSON.parse(raw);

/* ===== Cloud sync with 3-way merge (safe for several devices) ===== */
const BASE_PREFIX = 'labmgmt_base_';
const ARRAY_KEYS = { patients:'id', tests:'id', orders:'id', expenses:'id', insurance:'id', users:'username' };
const cloudStamp = {};      // key -> ms timestamp of the cloud row we last saw / wrote
const saveQueue = {};       // key -> promise chain (saves of one key run one after another)
const saveCount = {};       // key -> number of saves queued / running
let casBroken = false;      // true if the conditional update cannot work on this table (falls back to plain upsert)
let pendingUIRefresh = false;

function getBase(k){ try{ const r = localStorage.getItem(BASE_PREFIX+k); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function setBase(k, v){ try{ localStorage.setItem(BASE_PREFIX+k, JSON.stringify(v)); }catch(e){} }
function jeq(a, b){ return JSON.stringify(a) === JSON.stringify(b); }

// Lists of records: keep what others added/changed, apply only OUR changes and OUR deletions.
function mergeById(local, base, cloud, f){
  local = Array.isArray(local) ? local : [];
  cloud = Array.isArray(cloud) ? cloud : [];
  const baseMap  = new Map((Array.isArray(base) ? base : []).map(x => [x[f], x]));
  const cloudMap = new Map(cloud.map(x => [x[f], x]));
  const out = [], seen = new Set();
  for(const it of local){
    const id = it[f]; seen.add(id);
    const b = baseMap.get(id), c = cloudMap.get(id);
    if(!c){
      if(b && jeq(b, it)) continue;      // someone else deleted it and we did not touch it
      out.push(it);                      // new here, or edited here (edit wins over a remote delete)
    } else {
      out.push((!b || !jeq(b, it)) ? it : c);   // our edit wins; otherwise take the newest cloud copy
    }
  }
  for(const c of cloud){
    const id = c[f]; if(seen.has(id)) continue;
    const b = baseMap.get(id);
    if(b && jeq(b, c)) continue;         // we deleted it and nobody changed it since
    out.push(c);                         // added by someone else (or edited there after we deleted it)
  }
  return out;
}
function mergeObj(local, base, cloud){
  local = local || {}; base = base || {}; cloud = cloud || {};
  const out = Object.assign({}, cloud);
  for(const k of Object.keys(local)){ if(!(k in base) || !jeq(base[k], local[k])) out[k] = local[k]; }
  for(const k of Object.keys(base)){ if(!(k in local)) delete out[k]; }
  return out;
}
function mergeAudit(local, cloud){
  const map = new Map();
  [].concat(Array.isArray(cloud) ? cloud : [], Array.isArray(local) ? local : []).forEach(e => {
    map.set([e.ts, e.user, e.action, e.details].join('|'), e);
  });
  return Array.from(map.values()).sort((a, b) => String(b.ts).localeCompare(String(a.ts))).slice(0, 300);
}
function mergeValue(key, local, base, cloud){
  if(cloud == null) return local;
  if(key === 'auditLog') return mergeAudit(local, cloud);
  if(ARRAY_KEYS[key]) return Array.isArray(cloud) ? mergeById(local, base, cloud, ARRAY_KEYS[key]) : local;
  if(key === 'settings' || key === 'userRoles'){
    const m = mergeObj(local, base, cloud);
    if(key === 'settings'){
      ['nextOrderNo', 'nextInvoiceNo'].forEach(f => {
        const a = Number(local && local[f]), b = Number(cloud && cloud[f]);
        if(!isNaN(a) || !isNaN(b)) m[f] = Math.max(isNaN(a) ? 0 : a, isNaN(b) ? 0 : b);
      });
    }
    return m;
  }
  return local;
}

// Read the cloud copy, merge it with ours, write back only if nobody changed it in between.
async function pushKey(key){
  const MAX = 5;
  for(let attempt = 0; attempt < MAX; attempt++){
    const { data: row, error: rerr } = await sb.from('lab_data').select('value, updated_at').eq('key', key).maybeSingle();
    if(rerr) throw rerr;
    const merged = row ? mergeValue(key, state[key], getBase(key), row.value) : state[key];
    const stamp = new Date().toISOString();
    const last = attempt === MAX - 1;
    let ok = false;
    if(!row){
      const { error } = await sb.from('lab_data').insert({ key, value: merged, updated_at: stamp });
      if(error){ if(last) throw error; continue; }   // maybe another device inserted at the same moment
      ok = true;
    } else if(casBroken || last){
      const { error } = await sb.from('lab_data').upsert({ key, value: merged, updated_at: stamp });
      if(error) throw error;
      ok = true;
    } else {
      const { data: upd, error } = await sb.from('lab_data').update({ value: merged, updated_at: stamp })
        .eq('key', key).eq('updated_at', row.updated_at).select('key');
      if(error){ if(!/fetch|network|Failed/i.test(String(error.message || ''))) casBroken = true; continue; }
      if(!upd || upd.length === 0){
        const { data: again } = await sb.from('lab_data').select('updated_at').eq('key', key).maybeSingle();
        if(again && Date.parse(again.updated_at) === Date.parse(row.updated_at)) casBroken = true; // nobody else changed it, so the condition itself cannot match
        continue;                                    // someone else wrote first: merge again with their version
      }
      ok = true;
    }
    if(ok){
      state[key] = merged;
      try{ localStorage.setItem(LS_PREFIX + key, JSON.stringify(merged)); }catch(e){}
      setBase(key, merged);
      cloudStamp[key] = Date.parse(stamp);
      return merged;
    }
  }
  throw new Error('sync conflict');
}

function save(key, silent){
  // always cache locally first so nothing is ever lost, even offline
  try{ localStorage.setItem(LS_PREFIX + key, JSON.stringify(state[key])); }catch(e){ console.error('local cache error', e); }
  markPending(key);
  saveCount[key] = (saveCount[key] || 0) + 1;
  const run = async () => {
    const before = JSON.stringify(state[key]);
    try{
      await pushKey(key);
      saveCount[key]--;
      if(saveCount[key] === 0) clearPending(key);
      cloudConnected = true;
      if(JSON.stringify(state[key]) !== before) refreshUIIfIdle([key]);   // other devices' changes were merged in
    }catch(e){
      saveCount[key]--;
      console.error('cloud save failed, queued for sync', key, e);
      cloudConnected = false;
      if(!silent) showToast('لا يوجد اتصال بالإنترنت — تم الحفظ على جهازك وسيتم رفعه تلقائياً عند عودة الاتصال');
    }
    updateDbStatus();
  };
  saveQueue[key] = (saveQueue[key] || Promise.resolve()).then(run);
  return saveQueue[key];
}

let syncing = false;
async function syncPending(){
  if(syncing || !anyPending()) return;
  syncing = true;
  try{
    for(const k of DATA_KEYS){
      if(!hasPending(k) || saveCount[k] > 0 || state[k] === undefined) continue;
      await save(k, true);
    }
  } finally { syncing = false; }
  updateDbStatus();
  if(!anyPending()){ cloudConnected = true; updateDbStatus(); showToast('تمت مزامنة كل التغييرات مع السحابة بنجاح'); }
}

// Pull changes made on other devices (every 15s, when the tab becomes visible, when internet returns)
let pulling = false;
async function pullCloud(){
  if(pulling || !ready || !currentUser) return;
  pulling = true;
  try{
    if(pendingUIRefresh) refreshUIIfIdle([]);
    const { data, error } = await sb.from('lab_data').select('key, updated_at').in('key', DATA_KEYS);
    if(error) throw error;
    const changed = [];
    for(const row of (data || [])){
      const k = row.key;
      if(hasPending(k) || saveCount[k] > 0) continue;
      if(cloudStamp[k] && Date.parse(row.updated_at) === cloudStamp[k]) continue;
      const { data: full, error: e2 } = await sb.from('lab_data').select('value, updated_at').eq('key', k).maybeSingle();
      if(e2 || !full || full.value == null) continue;
      if(hasPending(k) || saveCount[k] > 0) continue;       // we started saving while fetching
      state[k] = full.value;
      try{ localStorage.setItem(LS_PREFIX + k, JSON.stringify(full.value)); }catch(e){}
      setBase(k, full.value);
      cloudStamp[k] = Date.parse(full.updated_at);
      changed.push(k);
    }
    cloudConnected = true;
    updateDbStatus();
    if(changed.length) refreshUIIfIdle(changed);
  }catch(e){
    console.error('cloud pull failed', e);
  }finally{ pulling = false; }
}
function refreshUIIfIdle(keys){

    const ov = document.getElementById('overlay');

    const typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
    if((ov && ov.classList.contains('open')) || typing){ pendingUIRefresh = true; return; }   // do not disturb typing
    pendingUIRefresh = false;
    renderPage();
  }catch(e){ console.error(e); }
}

function transliterateArabicName(ar){

  const n = Number(p.age), u = p.ageUnit || 'y';
  if(lang==='en'){ const w = {y:'year',m:'month',d:'day'}[u]; return `${n} ${w}${n===1?'':'s'}`; }
  const ar = {y:['سنة','سنتان','سنوات','سنة'], m:['شهر','شهران','أشهر','شهراً'], d:['يوم','يومان','أيام','يوماً']}[u];
  if(n===1) return ar[0];
  if(n===2) return ar[1];
  if(n>=3 && n<=10) return `${n} ${ar[2]}`;
  return `${n} ${ar[3]}`;
}

function defaultRefInput(t, gender){

function effTest(t, ov){
  if(!ov || (!ov.unitOv && !ov.refOv)) return t;
  const c = Object.assign({}, t);
  if(ov.unitOv) c.unit = ov.unitOv;
  if(ov.refOv){
    const m = String(ov.refOv).match(/^\s*(-?\d+(?:\.\d+)?)\s*(?:-|–|—|to)\s*(-?\d+(?:\.\d+)?)\s*$/i);
    c.refLowM = c.refHighM = c.refLowF = c.refHighF = null;
    if(m){ c.refLow = parseFloat(m[1]); c.refHigh = parseFloat(m[2]); c.refText = ''; }
    else { c.refLow = null; c.refHigh = null; c.refText = ov.refOv; }
  }
  return c;
}

/* Real critical (panic) values used by labs — only these trigger the red "critical" alert.
   Anything else outside the range is just High / Low. */
const CRITICAL_LIMITS = {
  'fasting blood sugar (fbs)':[40,450], 'random blood sugar (rbs)':[40,450], 'ogtt fasting glucose':[40,450],
  'ogtt 1-hour glucose':[40,450], 'ogtt 2-hour glucose':[40,450], 'homa-ir fasting glucose':[40,450],
  'potassium (k)':[2.8,6.2], 'sodium (na)':[120,160], 'chloride (cl)':[80,120], 'calcium':[6,13],
  'magnesium':[1,4.7], 'phosphorus':[1,null],
  'hemoglobin (hb)':[7,20], 'hematocrit (hct)':[20,60], 'white blood cell count (wbc)':[2,30],
  'platelet count (plt)':[20,1000], 'neutrophils (absolute)':[0.5,null],
  'inr':[null,5], 'partial thromboplastin time (ptt)':[null,100], 'fibrinogen':[100,null],
  'creatinine':[null,7.4], 'urea':[null,214], 'troponin i':[null,0.4]
};
/* A one-sided reference written as text, e.g. "< 200", "≥ 39", "> 40 | Optimal ..." */
function parseThreshold(txt){
  const first = String(txt||'').split('|')[0].trim();
  const m = first.match(/^(<=|>=|≤|≥|<|>)\s*(-?\d+(?:\.\d+)?)(?:\s*[A-Za-zµ%/^0-9.²]*)?$/);
  if(!m) return null;
  const op = {'<=':'≤','>=':'≥'}[m[1]] || m[1];
  const n = parseFloat(m[2]);
  return { op, n, lo: (op==='>'||op==='≥') ? n : null, hi: (op==='<'||op==='≤') ? n : null, text: String(txt).trim() };
}
function rangeLabel(range, unit){
  if(!range) return '';
  if(range.op){ const parts = range.text.split(' | '); parts[0] = parts[0] + (unit && !parts[0].includes(unit) ? ' '+unit : ''); return parts.join(' | '); }
  return `${range.lo} - ${range.hi}${unit?' '+unit:''}`;
}
function computeFlag(test, value, gender){
  if(value===''||value===undefined||value===null) return null;
  const range = activeRefRange(test, gender);
  const v = parseFloat(String(value).replace(/[<>≤≥,\s]/g,''));
  if(!range || isNaN(v)) return null;
  let flag = 'normal';
  if(range.op){
    if(range.op==='<' && v >= range.n) flag = 'high';
    if(range.op==='≤' && v >  range.n) flag = 'high';
    if(range.op==='>' && v <= range.n) flag = 'low';
    if(range.op==='≥' && v <  range.n) flag = 'low';
  } else {
    if(v < range.lo) flag = 'low';
    else if(v > range.hi) flag = 'high';
  }
  const crit = CRITICAL_LIMITS[((test.nameEn||test.name||'')+'').trim().toLowerCase()];
  if(crit){
    if(crit[0]!=null && v < crit[0]) return 'critical-low';
    if(crit[1]!=null && v > crit[1]) return 'critical-high';
  }
  return flag;
}
function activeRefRange(test, gender){
  if(gender==='male' && test.refLowM!=null && test.refHighM!=null) return { lo:test.refLowM, hi:test.refHighM };
  if(gender==='female' && test.refLowF!=null && test.refHighF!=null) return { lo:test.refLowF, hi:test.refHighF };
  if(test.refLow!=null && test.refHigh!=null) return { lo:test.refLow, hi:test.refHigh };
  const th = test.refLow==null && test.refHigh==null ? parseThreshold(test.refText) : null;
  if(th) return th;
  return null;
}

function phaseKey(t){
  if(!t) return null;
  const n = ((t.nameEn||t.name||'')+'').trim().toLowerCase();
  if(n==='fsh' || /^fsh\b/.test(n) || n.includes('follicle stimulating') || n.includes('follicle-stimulating')) return 'fsh';
  if(n==='lh' || /^lh\b/.test(n) || n.includes('luteinizing') || n.includes('luteinising')) return 'lh';
  if(/^estradiol|^e2\b|oestradiol/.test(n)) return 'e2';
  if(/^progesterone/.test(n)) return 'prog';
  if(/^cortisol/.test(n)) return 'cort';
  return null;
}
function phaseById(t, id){ const k = phaseKey(t); return k ? (PHASE_RANGES[k].find(p=>p.id===id) || null) : null; }
function phaseRangeStr(ph){ return `${ph.lo} - ${ph.hi}`; }
function applyPhase(orderId, tid, phaseId){
  const o = state.orders.find(x=>x.id===orderId); if(!o) return;
  const t = testById(tid); const ph = phaseById(t, phaseId);
  const r = document.getElementById('rov-'+tid);
  if(r) r.value = ph ? phaseRangeStr(ph) : '';
  captureResultsDraft(o);
  if(!ph && o.results[tid]){ delete o.results[tid].refOv; delete o.results[tid].phase; }
  if(ph && o.results[tid]) o.results[tid].phase = ph.id;
  openResultsModal(orderId);
}
function flagBadge(flag){
  if(flag==='normal') return `<span class="badge badge-normal">Normal</span>`;
  if(flag==='high') return `<span class="badge badge-high">High</span>`;
  if(flag==='low') return `<span class="badge badge-low">Low</span>`;
  if(flag==='critical-high') return `<span class="badge badge-critical">High</span>`;
  if(flag==='critical-low') return `<span class="badge badge-critical">Low</span>`;
  return `<span class="badge" style="background:#EEE;color:#777">—</span>`;
}

async function savePatient(id){
  const name = document.getElementById('pf-name').value.trim();
  if(!name){ showToast('الرجاء إدخال اسم المريض'); return; }
  const data = {
    name,
    nameEn: (document.getElementById('pf-name-en')||{value:''}).value.trim(),
    age: document.getElementById('pf-age').value ? parseInt(document.getElementById('pf-age').value) : null,
    ageUnit: document.getElementById('pf-age-unit').value || 'y',
    gender: document.getElementById('pf-gender').value || null,
    phone: document.getElementById('pf-phone').value.trim(),
    address: document.getElementById('pf-address').value.trim(),
  };
  if(id){
    const p = state.patients.find(x=>x.id===id);
    Object.assign(p, data);
  } else {
    state.patients.push({ id: uid(), createdAt: new Date().toISOString(), ...data });
  }
  await save('patients');
  closeModal(); renderPatients(); showToast('تم حفظ بيانات المريض');
  logAudit(id?'تعديل مريض':'إضافة مريض', name);
}
async function deletePatient(id){
  if(!canDeletePatients()){
    showToast('عذراً، ليس لديك صلاحية لحذف سجلات المرضى');
    return;
  }
  if(!confirm('هل تريد حذف هذا المريض؟ سيتم الاحتفاظ بطلباته السابقة.')) return;
  const p = state.patients.find(x=>x.id===id);
  state.patients = state.patients.filter(p=>p.id!==id);
  await save('patients'); renderPatients(); showToast('تم حذف المريض');
  logAudit('حذف مريض', p? p.name : id);
}

  { bg:'#E4EFEE', fg:'#0A4642', bd:'#BFD9D5' }, // teal

  { bg:'#F5E4EE', fg:'#9C3A6E', bd:'#EAC5DA' }, // pink

function categoryColor(cat){
  const key = (cat||'عام');
  let hash = 0;
  for(let i=0;i<key.length;i++){ hash = (hash*31 + key.charCodeAt(i)) >>> 0; }
  return CATEGORY_PALETTE[hash % CATEGORY_PALETTE.length];
}
function testCategoryBadge(cat){
  const label = cat || 'عام';
  const c = categoryColor(label);
  return `<span class="badge" style="background:${c.bg};color:${c.fg};border:1px solid ${c.bd}">${escapeHtml(label)}</span>`;
}
function testCategories(){
  const set = new Set(state.tests.map(t => t.category || 'عام'));
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'ar'));
}
function toggleTestCategory(cat){
  if(testsCollapsed.has(cat)) testsCollapsed.delete(cat); else testsCollapsed.add(cat);

function suggestTestTranslation(arabicName){
  const norm = (arabicName||'').toLowerCase();
  for(const [keywords, en] of COMMON_TEST_TRANSLATIONS){
    if(keywords.some(k=>norm.includes(k.toLowerCase()))) return en;
  }
  return null;
}

  [['Albumin/Creatinine Ratio (ACR)','Urine','mg/g',0,30], ['Albumin/Creatinine Ratio (ACR)','Urine','mg/g','','','< 30']]
];
const REF_REVIEW_V1_NEW = ['Complete Blood Count (CBC)','Neutrophils %','Lymphocytes %','Monocytes %','Eosinophils %','Basophils %','Neutrophils (Absolute)','Lymphocytes (Absolute)','Monocytes (Absolute)','Eosinophils (Absolute)','Basophils (Absolute)','Mean Platelet Volume (MPV)','Lipid Profile','Prothrombin Time (PT)','INR','Prothrombin Time (PT/INR)'];
function _rowRef(row){
  const [nameEn, category, unit, refLow, refHigh, refText, lm, hm, lf, hf, panel] = row;
  const nz = v => (v===''||v==null) ? null : v;
  return { unit: unit||'', refLow:nz(refLow), refHigh:nz(refHigh), refText: refText||'', refLowM:nz(lm), refHighM:nz(hm), refLowF:nz(lf), refHighF:nz(hf), panel: panel||null };
}
function applyRefReviewV1(){
  let changed = 0;
  const find = n => state.tests.find(x=>((x.nameEn||x.name||'')+'').trim().toLowerCase()===n.toLowerCase());
  const same = (a,b) => (a==null||a==='' ? null : Number(a)) === (b==null||b==='' ? null : Number(b));
  REF_REVIEW_V1.forEach(([oldRow, newRow])=>{
    const t = find(oldRow[0]); if(!t) return;
    const o = _rowRef(oldRow), nw = _rowRef(newRow);
    const untouched = (t.unit||'')===o.unit && same(t.refLow,o.refLow) && same(t.refHigh,o.refHigh) && (t.refText||'')===o.refText
      && ((t.refLowM==null && t.refHighM==null) || (same(t.refLowM,o.refLowM) && same(t.refHighM,o.refHighM)))
      && ((t.refLowF==null && t.refHighF==null) || (same(t.refLowF,o.refLowF) && same(t.refHighF,o.refHighF)));
    // the sperm-concentration fix from earlier is also treated as untouched
    const spermFix = oldRow[0]==='Semen Sperm Concentration' && /75/.test(t.refText||'');
    if(!untouched && !spermFix) return;
    Object.assign(t, { unit:nw.unit, refLow:nw.refLow, refHigh:nw.refHigh, refText:nw.refText, refLowM:nw.refLowM, refHighM:nw.refHighM, refLowF:nw.refLowF, refHighF:nw.refHighF });
    if(nw.panel && !t.panel) t.panel = nw.panel;
    changed++;
  });
  // add the new CBC differential / panels (components first, so panels can find them)
  REF_REVIEW_V1_NEW.forEach(n=>{
    const row = DEFAULT_TEST_CATALOG.find(r=>r[0]===n); if(!row) return;
    const alias = { 'Complete Blood Count (CBC)': /\bcbc\b|صورة دم كاملة/i, 'Lipid Profile': /lipid profile|صورة دهون|ملف دهون/i };
    const ex = find(n) || (alias[n] ? state.tests.find(x=>!x.panel && alias[n].test((x.nameEn||'')+' '+(x.name||''))) : null), rr = _rowRef(row);
    if(ex){ if(rr.panel && !ex.panel){ ex.panel = rr.panel; if(!ex.refText || /حسب المكونات/.test(ex.refText)) ex.refText = 'See components'; ex.refLow = ex.refHigh = null; changed++; } return; }
    if(n==='Prothrombin Time (PT/INR)') return;
    state.tests.push(Object.assign({ id: uid(), name:n, nameEn:n, category: row[1], price:0 }, rr));
    changed++;
  });
  return changed;
}
/* v2: semen analysis brought in line with WHO 2021 lab reports — applied to every semen test (forced). */
const SEMEN_RENAME_V2 = { 'semen total motility':'Semen Total Motility (PR + NP)', 'semen progressive motility':'Semen Progressive Motility (PR)', 'semen non-progressive motility':'Semen Non-progressive Motility (Grade C)', 'semen immotile sperm':'Semen Immotile Sperm (Grade D)' };
function applySemenV2(){
  let changed = 0;
  const key = x => ((x.nameEn||x.name||'')+'').trim().toLowerCase();
  state.tests.forEach(t=>{ const nn = SEMEN_RENAME_V2[key(t)]; if(nn){ t.name = nn; t.nameEn = nn; changed++; } });
  DEFAULT_TEST_CATALOG.filter(r=>r[1]==='Semen').forEach(row=>{
    const rr = _rowRef(row);
    let t = state.tests.find(x=>key(x)===row[0].toLowerCase());
    if(!t){ t = { id: uid(), name: row[0], nameEn: row[0], category: 'Semen', price: 0 }; state.tests.push(t); }
    Object.assign(t, { unit: rr.unit, refLow: rr.refLow, refHigh: rr.refHigh, refText: rr.refText, refLowM:null, refHighM:null, refLowF:null, refHighF:null });
    if(rr.panel) t.panel = rr.panel;
    changed++;
  });
  return changed;
}
/* v4: testosterone total/free with male & female ranges; PSA total/free/ratio panel (forced). */
function applyHormonePsaV4(){
  let changed = 0;
  const key = x => ((x.nameEn||x.name||'')+'').trim().toLowerCase();
  const rename = { 'testosterone':'Testosterone (Total)', 'prostate specific antigen (psa)':'Total PSA', 'psa':'Total PSA', 'total psa (prostate specific antigen)':'Total PSA' };
  const fuzzy = k => {
    if(rename[k]) return rename[k];
    const free = /free|حر/.test(k), ratio = /ratio|نسبة|%/.test(k);
    if(/testosterone|تستوستيرون|تستستيرون/.test(k)) return free ? 'Testosterone (Free)' : 'Testosterone (Total)';
    if(/\bpsa\b|prostate|بروستات/.test(k) && !ratio && !/total & free|panel/.test(k)) return free ? 'Free PSA' : 'Total PSA';
    return null;
  };
  state.tests.forEach(t=>{ const nn = fuzzy(key(t)); if(nn && key(t)!==nn.toLowerCase() && !state.tests.some(x=>key(x)===nn.toLowerCase())){ t.name = nn; t.nameEn = nn; changed++; } });
  ['Testosterone (Total)','Testosterone (Free)','Total PSA','Free PSA','Free/Total PSA Ratio','PSA (Total & Free)'].forEach(n=>{
    const row = DEFAULT_TEST_CATALOG.find(r=>r[0]===n); if(!row) return;
    const rr = _rowRef(row);
    let t = state.tests.find(x=>key(x)===n.toLowerCase());
    if(!t){ t = { id: uid(), name:n, nameEn:n, category: row[1], price: 0 }; state.tests.push(t); }
    t.nameEn = n; if(/^[\x00-\x7F]*$/.test(t.name||'')) t.name = n;
    Object.assign(t, { unit: rr.unit, refLow: rr.refLow, refHigh: rr.refHigh, refText: rr.refText, refLowM: rr.refLowM, refHighM: rr.refHighM, refLowF: rr.refLowF, refHighF: rr.refHighF });
    if(rr.panel) t.panel = rr.panel;
    changed++;
  });
  return changed;
}
async function refreshRangesFromCatalog(){
  if(!confirm('سيتم تحديث الوحدات والمعدلات الطبيعية لكل التحاليل الموجودة حسب الدليل المعتمد بالنظام.\nالأسعار والنتائج السابقة لن تتغير.\nأي معدل عدّلته يدوياً لتحليل موجود بالدليل سيُستبدل.\n\nهل تريد المتابعة؟')) return;
  applyHormonePsaV4(); applySemenV2();
  const key = x => ((x.nameEn||x.name||'')+'').trim().toLowerCase();
  let n = 0;
  DEFAULT_TEST_CATALOG.forEach(row=>{
    const t = state.tests.find(x=>key(x)===row[0].toLowerCase()); if(!t) return;
    const rr = _rowRef(row);
    const before = JSON.stringify([t.unit,t.refLow,t.refHigh,t.refText,t.refLowM,t.refHighM,t.refLowF,t.refHighF,t.panel]);
    Object.assign(t, { unit: rr.unit, refLow: rr.refLow, refHigh: rr.refHigh, refText: rr.refText, refLowM: rr.refLowM, refHighM: rr.refHighM, refLowF: rr.refLowF, refHighF: rr.refHighF });
    if(rr.panel) t.panel = rr.panel;
    if(JSON.stringify([t.unit,t.refLow,t.refHigh,t.refText,t.refLowM,t.refHighM,t.refLowF,t.refHighF,t.panel]) !== before) n++;
  });
  await save('tests'); renderTests();
  showToast(n ? `تم تحديث المعدلات الطبيعية لـ ${n} تحليل` : 'كل المعدلات محدّثة بالفعل');
  logAudit('تحديث المعدلات من الدليل', String(n));
}
async function importDefaultTestCatalog(){
  const existing = new Set(state.tests.map(t=>(t.nameEn||t.name||'').trim().toLowerCase()));
  let added = 0, updated = 0;
  DEFAULT_TEST_CATALOG.forEach(row=>{
    const [nameEn, category, unit, refLow, refHigh, refText, refLowM, refHighM, refLowF, refHighF, panel, legacyName] = row;
    const key = nameEn.trim().toLowerCase();
    if(!existing.has(key) && panel && legacyName){
      const lt = state.tests.find(x=>(x.nameEn||x.name||'').trim().toLowerCase()===legacyName.toLowerCase());
      if(lt){ lt.name = nameEn; lt.nameEn = nameEn; lt.category = category; lt.panel = panel; existing.add(key); updated++; return; }
    }
    if(existing.has(key)){
      const t = state.tests.find(x=>(x.nameEn||x.name||'').trim().toLowerCase()===key);
      let changed = 0;
      if(refLowM!=null && t.refLowM==null){ t.refLowM=refLowM; changed++; }
      if(refHighM!=null && t.refHighM==null){ t.refHighM=refHighM; changed++; }
      if(refLowF!=null && t.refLowF==null){ t.refLowF=refLowF; changed++; }
      if(refHighF!=null && t.refHighF==null){ t.refHighF=refHighF; changed++; }
      if(panel && !t.panel){ t.panel = panel; changed++; }
      if(key==='beta hcg (quantitative / titer)' && refText && t.refText!==refText){ t.refText = refText; changed++; }
      if((panel || /^ogtt /i.test(nameEn)) && t.category!==category){ t.category = category; changed++; }
      if(changed>0) updated++;
      return;
    }
    state.tests.push({
      id: uid(), name: nameEn, nameEn, category, price: 0,
      unit: unit||'', refLow: refLow===''?null:refLow, refHigh: refHigh===''?null:refHigh,
      refText: refText||'',
      refLowM: refLowM==null?null:refLowM, refHighM: refHighM==null?null:refHighM,
      refLowF: refLowF==null?null:refLowF, refHighF: refHighF==null?null:refHighF,
      panel: panel || null
    });
    added++;
  });
  if(added===0 && updated===0){ showToast('كل هذه التحاليل موجودة عندك مسبقاً'); return; }
  await save('tests');
  renderTests();
  const parts = [];
  if(added>0) parts.push(`تمت إضافة ${added} تحليل جديد`);
  if(updated>0) parts.push(`تم تحديث المعدلات الطبيعية لـ ${updated} تحليل`);
  if(parts.length===0) parts.push('لا توجد تغييرات');
  showToast(parts.join(' — ') + (added>0 ? ' — يرجى مراجعة الأسعار لكل تحليل' : ''));
}
async function autoTranslateTestNames(){
  const missing = state.tests.filter(t=>!t.nameEn || !t.nameEn.trim());
  const CATEGORY_TRANSLATIONS = {
    'بول':'Urine', 'دم':'Hematology', 'كيمياء':'Chemistry', 'كيمياء حيوية':'Chemistry',
    'هرمونات':'Hormones', 'فيروسات':'Serology', 'مناعة':'Immunology', 'بكتيريا':'Microbiology',
    'براز':'Stool', 'كبد وكلى':'Liver & Kidney', 'كبد':'Liver Function', 'كلى':'Kidney Function',
    'تخثر':'Coagulation', 'دهون':'Lipid Profile', 'فيتامينات':'Vitamins', 'أخرى':'Other',
    'عام':'General',
  };
  let catFixed = 0;
  state.tests.forEach(t=>{
    const cat = (t.category||'').trim();
    if(CATEGORY_TRANSLATIONS[cat]){ t.category = CATEGORY_TRANSLATIONS[cat]; catFixed++; }
  });
  if(missing.length===0 && catFixed===0){ showToast('كل التحاليل والفئات بالإنجليزي بالفعل'); return; }
  let filled = 0;
  missing.forEach(t=>{
    const suggestion = suggestTestTranslation(t.name);
    if(suggestion){ t.nameEn = suggestion; filled++; }
  });
  if(filled>0 || catFixed>0) await save('tests');
  renderTests();
  const remaining = missing.length - filled;
  const parts = [];
  if(filled>0) parts.push(`تُرجم ${filled} اسم تحليل`);
  if(catFixed>0) parts.push(`تُرجمت ${catFixed} فئة`);
  if(remaining>0) parts.push(`تبقّى ${remaining} تحليل يحتاج إدخال يدوي`);
  showToast(parts.length ? parts.join(' — ') : 'لا يوجد شيء لترجمته');
}

async function saveTest(id){
  const name = document.getElementById('tf-name').value.trim();
  const nameEn = document.getElementById('tf-name-en').value.trim();
  const price = parseFloat(document.getElementById('tf-price').value);
  if(!nameEn || isNaN(price)){ showToast('الرجاء إدخال اسم التحليل بالإنجليزي والسعر'); return; }
  const type = document.getElementById('tf-reftype').value;
  const numVal = (elId) => document.getElementById(elId).value ? parseFloat(document.getElementById(elId).value) : null;
  const data = {
    name: name || nameEn, price,
    nameEn,
    category: document.getElementById('tf-category').value.trim(),
    unit: document.getElementById('tf-unit').value.trim(),
    refLow: type==='numeric' ? numVal('tf-reflow') : null,
    refHigh: type==='numeric' ? numVal('tf-refhigh') : null,
    refLowM: type==='numeric' ? numVal('tf-reflow-m') : null,
    refHighM: type==='numeric' ? numVal('tf-refhigh-m') : null,
    refLowF: type==='numeric' ? numVal('tf-reflow-f') : null,
    refHighF: type==='numeric' ? numVal('tf-refhigh-f') : null,
    refText: type==='text' ? document.getElementById('tf-reftext').value.trim() : '',
    panel: (()=>{ const l = document.getElementById('tf-panel').value.split('\n').map(x=>x.trim()).filter(Boolean); return l.length ? l : null; })(),
  };
  if(id){ Object.assign(state.tests.find(x=>x.id===id), data); }
  else{ state.tests.push({ id: uid(), ...data }); }
  await save('tests');
  const _ret = window._returnToOrder; window._returnToOrder = null;
  if(_ret){ openResultsModal(_ret); showToast('تم حفظ التعديل'); }
  else { closeModal(); renderTests(); showToast('تم حفظ التحليل'); }
  logAudit(id?'تعديل تحليل':'إضافة تحليل', name);
}
async function deleteTest(id){
  if(!confirm('هل تريد حذف هذا التحليل من الدليل؟')) return;
  const t = state.tests.find(x=>x.id===id);
  state.tests = state.tests.filter(t=>t.id!==id);
  await save('tests'); renderTests(); showToast('تم الحذف');

}

function addSelectedTest(testId){
  if(document.querySelector(`#of-tests [data-id="${testId}"]`)){ showToast('التحليل مضاف مسبقاً'); return; }
  const t = testById(testId); if(!t) return;
  if(Array.isArray(t.panel) && t.panel.length){
    const comps = t.panel.map(n=>state.tests.find(x=>(x.nameEn||x.name||'').trim().toLowerCase()===n.toLowerCase())).filter(Boolean);
    if(!comps.length){ showToast('مكونات هذا التحليل غير موجودة — اضغط "استيراد قائمة جاهزة" في صفحة التحاليل أولاً'); return; }
    const list = document.getElementById('of-tests');
    const usePanelPrice = (t.price||0) > 0;
    let n = 0, first = true;
    comps.forEach(c=>{
      if(document.querySelector(`#of-tests [data-id="${c.id}"]`)) return;
      list.insertAdjacentHTML('beforeend', testChipHTML(c)); n++;
      if(usePanelPrice){ const pi = document.getElementById('price-'+c.id); if(pi) pi.value = first ? t.price : 0; first = false; }
    });
    const si = document.getElementById('of-test-search'); si.value=''; si.focus();

function renderTestSearchResults(query){
  const box = document.getElementById('of-test-suggestions');
  let q = (query||'').trim().toLowerCase().replace(/leucocyte/g,'leukocyte').replace(/oggt/g,'ogtt').replace(/groub|grop/g,'group');
  if(!q){ box.innerHTML=''; box.classList.remove('open'); return; }
  const q2 = (q.length>3 && q.endsWith('s')) ? q.slice(0,-1) : q;
  const already = new Set([...document.querySelectorAll('#of-tests [data-id]')].map(el=>el.getAttribute('data-id')));
  const matches = state.tests
    .filter(t=>!already.has(t.id))
    .map(t=>{
      const disp = testDisplayName(t).toLowerCase();
      const cat = (t.category||'').toLowerCase();
      let tier;
      if(disp.startsWith(q) || disp.startsWith(q2)) tier = 0;
      else if(disp.includes(q) || disp.includes(q2)) tier = 1;
      else if(cat.includes(q) && q.length>=2) tier = 2;
      else tier = -1;
      return { t, disp, tier };
    })
    .filter(x=>x.tier>=0)
    .sort((a,b)=> a.tier - b.tier || a.disp.localeCompare(b.disp))
    .slice(0, 40)
    .map(x=>x.t);
  if(matches.length===0){
    box.innerHTML = `<div class="suggestion-empty">لا توجد نتائج مطابقة لـ "${escapeHtml(query)}"</div>`;
    box.classList.add('open');
    return;
  }
  box.innerHTML = matches.map(t=>{
    const c = categoryColor(t.category||'عام');
    return `<div class="suggestion-item" onmousedown="event.preventDefault(); addSelectedTest('${t.id}')">
      <span dir="ltr" style="font-weight:700">${escapeHtml(testDisplayName(t))}</span>
      <span class="badge" style="background:${c.bg};color:${c.fg};border:1px solid ${c.bd}">${escapeHtml(t.category||'عام')}</span>
      <span style="margin-inline-start:auto;color:var(--ink-soft);font-size:12px">${fmtMoney(t.price)}</span>
    </div>`;
  }).join('');
  const catAll = state.tests.filter(t=>(t.category||'').trim().toLowerCase()===q && !already.has(t.id));
  if(catAll.length>=2){
    box.insertAdjacentHTML('afterbegin', `<div class="suggestion-item" style="font-weight:800;color:var(--primary);border-bottom:1px solid var(--line)" onmousedown="event.preventDefault(); addAllCategoryTests(decodeURIComponent('${encodeURIComponent(q)}'))">➕ إضافة كل التحاليل (${catAll.length})</div>`);
  }
  box.classList.add('open');
}
function addAllCategoryTests(qLower){
  const list = document.getElementById('of-tests');
  let n = 0;
  state.tests.forEach(t=>{
    if((t.category||'').trim().toLowerCase()!==qLower) return;
    if(document.querySelector(`#of-tests [data-id="${t.id}"]`)) return;
    list.insertAdjacentHTML('beforeend', testChipHTML(t)); n++;
  });
  const si = document.getElementById('of-test-search');
  si.value=''; si.focus();
  const box = document.getElementById('of-test-suggestions');
  box.innerHTML=''; box.classList.remove('open');
  updateOrderTotal();
  if(n>0) showToast(`تمت إضافة ${n} تحليل`);
}

function applyInsuranceDiscount(){
  const id = document.getElementById('of-insurance').value;
  const discountInput = document.getElementById('of-discount');
  if(!id){ return; }
  const ins = state.insurance.find(i=>i.id===id);
  if(!ins) return;
  const checked = [...document.querySelectorAll('#of-tests input[type=checkbox]:checked')];
  let sum = 0;
  checked.forEach(c=>{ const priceInput=document.getElementById('price-'+c.value); sum += priceInput?(parseFloat(priceInput.value)||0):0; });
  discountInput.value = Math.round(sum * (ins.discountPercent/100) * 100)/100;
  updateOrderTotal();
}
function updateOrderTotal(){
  const checked = [...document.querySelectorAll('#of-tests input[type=checkbox]:checked')];
  const discount = parseFloat(document.getElementById('of-discount').value)||0;
  let sum = 0;
  checked.forEach(c=>{
    const priceInput = document.getElementById('price-'+c.value);
    const price = priceInput ? (parseFloat(priceInput.value)||0) : (testById(c.value)?.price||0);
    sum += price;
  });
  sum -= discount;
  document.getElementById('of-total').textContent = fmtMoney(Math.max(sum,0));
}
async function saveOrder(){
  const patientId = document.getElementById('of-patient').value;

function previousResultFor(patientId, testId, excludeOrderId){
  const prevOrders = state.orders
    .filter(o => o.patientId===patientId && o.id!==excludeOrderId && o.status==='completed' && o.results && o.results[testId] && o.results[testId].value)
    .sort((a,b)=> b.date.localeCompare(a.date));
  if(prevOrders.length===0) return null;
  return { value: prevOrders[0].results[testId].value, date: prevOrders[0].date };
}
function onResultInput(testId, isNumeric, gender){
  const input = document.querySelector(`input[data-test="${testId}"]`);
  const t = testById(testId);
  if(isNumeric){
    const flag = computeFlag(effTest(t, readOverrides(testId, t, gender||null)), input.value, gender||null);
    document.getElementById('flag-'+testId).innerHTML = flagBadge(flag);
    input.classList.remove('flag-normal','flag-high','flag-low','flag-critical-high','flag-critical-low');
    if(flag) input.classList.add('flag-'+flag);
  }
  autoCalcDerived();
}
/* Calculated results: HOMA-IR = glucose (mg/dL) x insulin / 405 ; ACR (mg/g) = albumin (mg/L) / creatinine (mg/dL) x 100 */
function autoCalcDerived(){
  const inp = n => { const t = state.tests.find(x=>(x.nameEn||x.name||'').trim().toLowerCase()===n.toLowerCase()); return t ? document.querySelector(`input[data-test="${t.id}"]`) : null; };
  const calc = (aN, bN, outN, fn) => {
    const a = inp(aN), b = inp(bN), out = inp(outN); if(!a || !b || !out) return;
    const x = parseFloat(a.value), y = parseFloat(b.value); if(isNaN(x) || isNaN(y) || y===0) return;
    const v = String(Math.round(fn(x,y)*100)/100);
    if(out.value !== v){ out.value = v; out.dispatchEvent(new Event('input')); }
  };
  calc('HOMA-IR Fasting Glucose','HOMA-IR Fasting Insulin','HOMA-IR Index',(g,i)=>g*i/405);
  calc('Urine Microalbumin (ACR)','Urine Creatinine (ACR)','Albumin/Creatinine Ratio (ACR)',(al,cr)=>al/cr*100);
  calc('Free PSA','Total PSA','Free/Total PSA Ratio',(f,t)=>f/t*100);
}
function captureResultsDraft(o){
  const patient = state.patients.find(p=>p.id===o.patientId);
  const gender = patient ? patient.gender : null;
  o.results = o.results || {};
  o.testIds.forEach(tid=>{
    const t = testById(tid); if(!t) return;
    const input = document.querySelector(`input[data-test="${tid}"]`);
    if(!input) return;
    const value = input.value.trim();
    const ov = readOverrides(tid, t, gender);
    const te = effTest(t, ov);
    if(activeRefRange(te, gender)){ o.results[tid] = Object.assign({ value, flag: computeFlag(te, value, gender) }, ov); }
    else { const m = document.getElementById('manual-'+tid); o.results[tid] = Object.assign({ value, manualFlag: m ? m.value : '' }, ov); }
  });
  const nt = document.getElementById('rf-notes'); if(nt) o.notes = nt.value.trim();
}
function renderAddToOrderResults(orderId, query){
  const box = document.getElementById('rf-add-suggestions'); if(!box) return;
  const o = state.orders.find(x=>x.id===orderId); if(!o) return;
  let q = (query||'').trim().toLowerCase().replace(/leucocyte/g,'leukocyte').replace(/oggt/g,'ogtt').replace(/groub|grop/g,'group');
  if(!q){ box.innerHTML=''; box.classList.remove('open'); return; }
  const q2 = (q.length>3 && q.endsWith('s')) ? q.slice(0,-1) : q;
  const rawQ = (query||'').trim();
  const enc = encodeURIComponent(rawQ).replace(/'/g,'%27');
  const typedShown = rawQ.replace(/^urine sensitivity\s*-\s*/i,'');
  const customHtml = `
    <div class="suggestion-item" style="border-top:1px solid var(--line);color:var(--primary);font-weight:800" onmousedown="event.preventDefault(); addCustomToOrderFromResults('${orderId}','${enc}','abx')">➕ مضاد حيوي جديد: <span dir="ltr">${escapeHtml(typedShown)}</span></div>
    <div class="suggestion-item" style="color:var(--primary);font-weight:800" onmousedown="event.preventDefault(); addCustomToOrderFromResults('${orderId}','${enc}','test')">➕ تحليل جديد باسم: <span dir="ltr">${escapeHtml(rawQ)}</span></div>`;
  const matches = state.tests
    .filter(t=>!o.testIds.includes(t.id))
    .map(t=>{
      const disp = testDisplayName(t).toLowerCase();
      const cat = (t.category||'').toLowerCase();
      let tier;
      if(disp.startsWith(q) || disp.startsWith(q2)) tier = 0;
      else if(disp.includes(q) || disp.includes(q2)) tier = 1;
      else if(cat.includes(q) && q.length>=2) tier = 2;
      else tier = -1;
      return { t, disp, tier };
    })
    .filter(x=>x.tier>=0)
    .sort((a,b)=> a.tier - b.tier || a.disp.localeCompare(b.disp))
    .slice(0, 40).map(x=>x.t);
  if(matches.length===0){
    box.innerHTML = `<div class="suggestion-empty">لا توجد نتائج مطابقة لـ "${escapeHtml(query)}"</div>` + customHtml;
    box.classList.add('open'); return;
  }
  box.innerHTML = matches.map(t=>{
    const c = categoryColor(t.category||'عام');
    return `<div class="suggestion-item" onmousedown="event.preventDefault(); addTestToOrderFromResults('${orderId}','${t.id}')">
      <span dir="ltr" style="font-weight:700">${escapeHtml(testDisplayName(t))}</span>
      <span class="badge" style="background:${c.bg};color:${c.fg};border:1px solid ${c.bd}">${escapeHtml(t.category||'عام')}</span>
    </div>`;
  }).join('') + customHtml;
  box.classList.add('open');
}
async function addCustomToOrderFromResults(orderId, enc, kind){
  const raw = decodeURIComponent(enc||'').trim();
  if(!raw){ showToast('اكتب الاسم أولاً'); return; }
  let name = raw, category = 'Other';
  if(kind==='abx'){
    const base = raw.replace(/^urine sensitivity\s*-\s*/i,'').trim();
    name = 'Urine Sensitivity - ' + base.charAt(0).toUpperCase() + base.slice(1);
    category = 'Urine Culture';
  }
  let t = state.tests.find(x=>(x.nameEn||x.name||'').trim().toLowerCase()===name.toLowerCase());
  if(!t){
    t = { id: uid(), name, nameEn: name, category, price: 0, unit:'', refLow:null, refHigh:null, refText:'' };
    state.tests.push(t);
    await save('tests');
  }
  await addTestToOrderFromResults(orderId, t.id);
}

async function addTestToOrderFromResults(orderId, testId){
  const o = state.orders.find(x=>x.id===orderId); if(!o) return;
  const t = testById(testId); if(!t) return;
  captureResultsDraft(o);   // keep whatever was typed so far
  let ids = [t.id], panelPrice = false;
  if(Array.isArray(t.panel) && t.panel.length){
    ids = t.panel.map(n=>state.tests.find(x=>(x.nameEn||x.name||'').trim().toLowerCase()===n.toLowerCase())).filter(Boolean).map(x=>x.id);
    if(!ids.length){ showToast('مكونات هذا التحليل غير موجودة — اضغط "استيراد قائمة جاهزة" في صفحة التحاليل أولاً'); return; }
    panelPrice = (t.price||0) > 0;
  }
  o.prices = o.prices || {};
  let n = 0, first = true;
  ids.forEach(id=>{
    if(o.testIds.includes(id)) return;
    o.testIds.push(id); n++;
    const base = (testById(id) && testById(id).price) || 0;
    o.prices[id] = panelPrice ? (first ? t.price : 0) : base;
    first = false;
  });
  if(n===0){ showToast('هذه التحاليل مضافة مسبقاً'); return; }
  await save('orders');
  openResultsModal(orderId);
  showToast(`تمت إضافة ${n} تحليل للطلب`);
  logAudit('إضافة تحاليل لطلب', `#${o.no}: ${t.nameEn||t.name}`);
}
async function saveResults(orderId){
  const o = state.orders.find(x=>x.id===orderId);
  const patient = state.patients.find(p=>p.id===o.patientId);
  const gender = patient ? patient.gender : null;
  o.results = o.results || {};
  const criticals = [];
  o.testIds.forEach(tid=>{
    const t = testById(tid);
    const input = document.querySelector(`input[data-test="${tid}"]`);
    const value = input ? input.value.trim() : '';
    const ov = readOverrides(tid, t, gender);
    const te = effTest(t, ov);
    const range = activeRefRange(te, gender);
    if(range){
      const flag = computeFlag(te, value, gender);
      o.results[tid] = Object.assign({ value, flag }, ov);
      if(flag==='critical-high' || flag==='critical-low'){
        criticals.push({ name: testDisplayName(t), value: value||'—', label: rangeLabel(range,'') });
      }
    } else {
      const manualEl = document.getElementById('manual-'+tid);
      o.results[tid] = Object.assign({ value, manualFlag: manualEl? manualEl.value : '' }, ov);
    }
  });
  o.notes = document.getElementById('rf-notes').value.trim();
  if(criticals.length){
    const list = criticals.map(c=>`• ${c.name}: ${c.value} (المعدل ${c.label})`).join('\n');
    const ok = confirm('تنبيه — قيم حرجة:\n\n' + list + '\n\nهذه النتائج خارج المعدل الطبيعي بشكل خطير.\nتأكد من صحة النتيجة قبل الاعتماد.\n\nهل تريد حفظ النتائج وإتمام الطلب؟');
    if(!ok){ showToast('لم يتم الحفظ — تحقق من القيم الحرجة'); return; }
  }
  o.status = 'completed';
  await save('orders');
  closeModal(); renderPage();
  if(criticals.length){
    showToast('حُفظت أرقام حرجة: ' + criticals.map(c=>c.name).join('، '));
    logAudit('نتائج حرجة', `طلب #${o.no}: ${criticals.map(c=>c.name).join('، ')}`);
  } else {
    showToast('تم حفظ النتائج');
  }
  logAudit('حفظ نتائج', `طلب #${o.no}`);
}

async function addExpense(){
  const desc = document.getElementById('exp-desc').value.trim();
  const amount = parseFloat(document.getElementById('exp-amount').value);
  if(!desc || isNaN(amount)){ showToast('اكتب وصف المصروف والمبلغ'); return; }
  state.expenses = state.expenses || [];
  state.expenses.push({ id: uid(), description: desc, amount, date: new Date().toISOString() });
  await save('expenses');
  logAudit('إضافة مصروف', `${desc} — ${fmtMoney(amount)}`);
  renderReports();
  showToast('تم إضافة المصروف');
}
async function deleteExpense(id){
  state.expenses = (state.expenses||[]).filter(e=>e.id!==id);
  await save('expenses');
  logAudit('حذف مصروف', id);
  renderReports();
}
function monthLabel(ym){
  const [y,m] = ym.split('-');
  const d = new Date(parseInt(y), parseInt(m)-1, 1);
  return d.toLocaleDateString('ar-EG', { year:'numeric', month:'long' });
}

function onRoleChangeSelect(){
  const role = document.getElementById('new-user-role').value;
  const rev = document.getElementById('perm-revenue');
  const del = document.getElementById('perm-delete-patients');
  if(role === 'admin'){
    rev.checked = true;
    del.checked = true;
    rev.disabled = true;
    del.disabled = true;
  } else {
    rev.checked = false;
    del.checked = false;
    rev.disabled = false;
    del.disabled = false;
  }
}
async function saveNewUserAccount(){
  const uname = document.getElementById('new-user-uname').value.trim().toLowerCase();
  const pass = document.getElementById('new-user-pass').value.trim();
  const name = document.getElementById('new-user-name').value.trim() || uname;
  const role = document.getElementById('new-user-role').value;
  if(!uname || !pass){ showToast('الرجاء إدخال اسم المستخدم وكلمة المرور'); return; }
  
  state.users = state.users || [];
  const exists = state.users.find(u => u.username.toLowerCase() === uname);
  if(exists){ showToast('اسم المستخدم هذا موجود مسبقاً'); return; }

  const canRev = role === 'admin' ? true : document.getElementById('perm-revenue').checked;
  const canDel = role === 'admin' ? true : document.getElementById('perm-delete-patients').checked;

  state.users.push({
    username: uname,
    password: pass,
    name,
    role,
    canViewRevenue: canRev,
    canDeletePatients: canDel
  });
  await save('users');
  logAudit('إضافة مستخدم', `${uname} (${role})`);
  showToast('تمت إضافة المستخدم بنجاح');
  openSettingsModal();
}
async function deleteUserAccount(uname){
  if(uname === 'faten'){
    showToast('لا يمكن حذف الحساب الإداري الرئيسي');
    return;
  }
  if(!confirm(`هل أنت متأكد من حذف المستخدم ${uname}؟`)) return;
  state.users = (state.users || []).filter(u => u.username.toLowerCase() !== uname.toLowerCase());
  await save('users');
  logAudit('حذف مستخدم', uname);
  showToast('تم حذف المستخدم');
  openSettingsModal();
}

function onLogoSelected(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(file.size > 1024*1024){ showToast('الصورة كبيرة جداً — اختر صورة أقل من 1 ميغابايت'); input.value=''; return; }
  const previewImg = new Image();
  previewImg.onload = ()=>{
    if(previewImg.naturalWidth < 200 || previewImg.naturalHeight < 200){
      showToast('⚠ دقة الشعار منخفضة — سيبان مشوشاً في الطباعة. يُفضل صورة 300×300 بكسيل أو أكثر');
    }
  };
  previewImg.src = URL.createObjectURL(file);
  const reader = new FileReader();
  reader.onload = (e)=>{
    document.getElementById('sf-logo').value = e.target.result;
    const box = document.getElementById('sf-logo-preview');
    if(box) box.innerHTML = `<img src="${e.target.result}" style="width:48px;height:48px;object-fit:contain">`;
  };
  reader.readAsDataURL(file);
}
function updateDbStatus(){

  } else {
    dot.style.background = '#C97B4A';

}
